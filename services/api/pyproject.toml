[project]
name = "anum-api"
version = "0.1.0"
description = "ANUM FastAPI backend foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic-settings>=2.5.2",
  "uvicorn[standard]>=0.30.6"
]

[project.optional-dependencies]
test = [
  "httpx>=0.27.2",
  "pytest>=8.3.3"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
