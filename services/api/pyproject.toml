[build-system]
requires = [
  "setuptools==75.6.0",
  "wheel==0.45.1"
]
build-backend = "setuptools.build_meta"

[project]
name = "anum-api"
version = "0.1.0"
description = "ANUM FastAPI backend foundation"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.13.3",
  "anthropic==0.122.0",
  "boto3==1.43.72",
  "fastapi==0.115.0",
  "httpx==0.27.2",
  "nats-py==2.15.0",
  "psycopg[binary]==3.2.3",
  "pydantic-settings==2.5.2",
  "PyJWT[crypto]==2.13.0",
  "python-multipart==0.0.17",
  "redis==8.1.0",
  "sqlalchemy==2.0.35",
  "temporalio==1.31.0",
  "uvicorn[standard]==0.30.6"
]

[project.optional-dependencies]
test = [
  "httpx==0.27.2",
  "moto==5.2.2",
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["anum_api*"]
exclude = ["migrations*", "tests*"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "database: tests that require a migrated PostgreSQL database",
  "redis: tests that spin up a local redis-server/valkey process",
  "nats: tests that spin up a local nats-server process",
  "temporal: tests that spin up a local Temporal dev-server process"
]

[tool.ruff]
line-length = 100
