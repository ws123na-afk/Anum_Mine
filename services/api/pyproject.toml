[build-system]
requires = [
  "setuptools==84.0.0",
  "wheel==0.48.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "anum-api"
version = "0.1.0"
description = "ANUM FastAPI backend foundation"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.20.0",
  "boto3==1.43.108",
  "cryptography==50.0.2",
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "nats-py==2.16.0",
  "opentelemetry-api==1.45.0",
  "opentelemetry-exporter-otlp-proto-http==1.45.0",
  "opentelemetry-instrumentation-fastapi==0.66b0",
  "opentelemetry-instrumentation-httpx==0.66b0",
  "opentelemetry-instrumentation-sqlalchemy==0.66b0",
  "opentelemetry-sdk==1.45.0",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.15.0",
  "PyJWT[crypto]==2.15.1",
  "redis==8.1.0",
  "sqlalchemy==2.1.3",
  "starlette==1.7.0",
  "temporalio==1.34.0",
  "uvicorn[standard]==0.54.0"
]

[project.optional-dependencies]
test = [
  "moto[s3]==5.2.3",
  "pytest==9.1.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["anum_api*"]
exclude = ["migrations*", "tests*"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "database: tests that require a migrated PostgreSQL database",
  "nats: tests that require a reachable NATS JetStream server (ANUM_TEST_NATS_URL)",
  "valkey: tests that require a reachable Valkey/Redis server (ANUM_TEST_VALKEY_URL)",
  "s3: tests that require an S3-compatible endpoint such as SeaweedFS (ANUM_TEST_S3_ENDPOINT)",
  "temporal: tests that require a Temporal server (ANUM_TEST_TEMPORAL_TARGET or a downloadable test server)"
]

[tool.ruff]
line-length = 100
