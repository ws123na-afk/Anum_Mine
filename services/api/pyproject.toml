[build-system]
requires = [
  "setuptools==84.0.0",
  "wheel==0.48.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "anum-api"
version = "0.1.0"
description = "ANUM FastAPI backend foundation"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.20.0",
  "boto3==1.43.111",
  "cryptography==50.0.2",
  "defusedxml==0.7.1",
  "fastapi==0.143.0",
  "httpx==0.28.1",
  "nats-py==2.16.0",
  "opentelemetry-api==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
  "opentelemetry-instrumentation-fastapi==0.66b1",
  "opentelemetry-instrumentation-httpx==0.66b1",
  "opentelemetry-instrumentation-sqlalchemy==0.66b1",
  "opentelemetry-sdk==1.45.1",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.15.0",
  "pypdf==6.21.1",
  "PyJWT[crypto]==2.15.1",
  "redis==8.1.0",
  "sentry-sdk==2.71.0",
  "sqlalchemy==2.1.4",
  "starlette==1.7.0",
  "temporalio==1.34.0",
  "uvicorn[standard]==0.54.0"
]

[project.optional-dependencies]
test = [
  "moto[s3]==5.2.4",
  "pytest==9.1.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["anum_api*"]
exclude = ["migrations*", "tests*"]

[tool.setuptools.package-data]
# The coding workflow developer mode installs in target repositories (docs/developer-mode.md).
# The checked-in setup plan blueprints (docs/setup-plan.md).
# The trading knowledge library, read at startup (docs/finance-trading-intel.md#skills-and-tools).
anum_api = ["workflow_templates/*.yml", "blueprints/*.json", "finance/intel/skills/*/SKILL.md", "finance/intel/skills/*/tools.json", "finance/intel/skills/*/references/*.md"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "database: tests that require a migrated PostgreSQL database",
  "nats: tests that require a reachable NATS JetStream server (ANUM_TEST_NATS_URL)",
  "valkey: tests that require a reachable Valkey/Redis server (ANUM_TEST_VALKEY_URL)",
  "s3: tests that require an S3-compatible endpoint such as SeaweedFS (ANUM_TEST_S3_ENDPOINT)",
  "clamav: tests that require a reachable ClamAV clamd (ANUM_TEST_CLAMD_HOST, ANUM_TEST_CLAMD_PORT)",
  "temporal: tests that require a Temporal server (ANUM_TEST_TEMPORAL_TARGET or a downloadable test server)",
  "live_model: calls the real hosted model API (ANTHROPIC_API_KEY); deselected unless -m names live_model"
]

[tool.ruff]
line-length = 100
