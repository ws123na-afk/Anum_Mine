[build-system]
requires = [
  "setuptools==84.2.1",
  "wheel==0.48.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "anum-api"
version = "0.1.0"
description = "ANUM FastAPI backend foundation"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.20.1",
  "boto3==1.43.126",
  "cryptography==50.0.2",
  "defusedxml==0.7.1",
  "dnspython==2.9.2",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "nats-py==2.16.0",
  "opentelemetry-api==1.45.2",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  "opentelemetry-instrumentation-fastapi==0.66b2",
  "opentelemetry-instrumentation-httpx==0.66b2",
  "opentelemetry-instrumentation-sqlalchemy==0.66b2",
  "opentelemetry-sdk==1.45.2",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.16.2",
  "pdfminer.six==20260107",
  "pypdf==7.0.0",
  "Pillow==13.0.0",
  "PyJWT[crypto]==2.15.1",
  "redis==8.1.0",
  "sentry-sdk==2.74.0",
  "sqlalchemy==2.1.8",
  "starlette==1.10.0",
  "temporalio==1.35.0",
  "uvicorn[standard]==0.54.0"
]

[project.optional-dependencies]
# Only the browser image installs it (docs/browser-research.md#the-browser-image).
browser = [
  "playwright==1.64.1"
]
test = [
  "moto[s3]==5.2.5",
  "pytest==9.2.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["anum_api*"]
exclude = ["migrations*", "tests*"]

[tool.setuptools.package-data]
# The coding workflow developer mode installs in target repositories (docs/developer-mode.md).
# The checked-in setup plan blueprints (docs/setup-plan.md).
# The Arabic font the PDF writer embeds, with its licence (anum_api/pdf_fonts/SOURCE.txt).
# The trading knowledge library, read at startup (docs/finance-trading-intel.md#skills-and-tools).
anum_api = ["pdf_fonts/*.ttf", "pdf_fonts/*.txt", "workflow_templates/*.yml", "blueprints/*.json", "finance/intel/skills/*/SKILL.md", "finance/intel/skills/*/tools.json", "finance/intel/skills/*/references/*.md"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "database: tests that require a migrated PostgreSQL database",
  "nats: tests that require a reachable NATS JetStream server (ANUM_TEST_NATS_URL)",
  "valkey: tests that require a reachable Valkey/Redis server (ANUM_TEST_VALKEY_URL)",
  "s3: tests that require an S3-compatible endpoint such as SeaweedFS (ANUM_TEST_S3_ENDPOINT)",
  "clamav: tests that require a reachable ClamAV clamd (ANUM_TEST_CLAMD_HOST, ANUM_TEST_CLAMD_PORT)",
  "temporal: tests that require a Temporal server (ANUM_TEST_TEMPORAL_TARGET or a downloadable test server)",
  "live_model: calls the real hosted model API (ANTHROPIC_API_KEY); deselected unless -m names live_model",
  "browser: drives a real Chromium through Playwright (ANUM_TEST_CHROMIUM_PATH or an installed browser); deselected unless -m names browser",
  "ocr: runs the real Tesseract (with eng and ara data) of the document vault's OCR service; deselected unless -m names ocr"
]

[tool.ruff]
line-length = 100
