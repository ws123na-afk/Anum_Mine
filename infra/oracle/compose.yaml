# ANUM on one VM (Oracle Cloud Always Free Ampere A1, arm64; any Docker host works).
# Step-by-step guide (Windows, PowerShell, no Kubernetes): docs/deploy-oracle.md.
# The Render path (render.yaml) and the Kubernetes path (infra/helm/anum) stay the
# alternatives.
#
#   cd infra/oracle && docker compose build && docker compose up -d
#
# Every value comes from infra/oracle/.env (generated on the server by install.sh from
# .env.example, mode 600, gitignored). Rules this file keeps
# (services/api/tests/test_oracle_compose.py checks them):
# - No credential is written here: every secret is a ${VAR} reference to .env.
# - Only Caddy publishes ports (80 and 443). PostgreSQL, Valkey, Keycloak's plain HTTP
#   port, the API and the web container are reachable only on the compose networks.
# - The API never connects as the schema owner. `db-init` creates the roles with
#   infra/helm/bootstrap-database.sql (as on Render and Kubernetes), `migrate` runs
#   `alembic upgrade head` as anum_migrator, and the API, the retention job and the
#   scheduler use anum_app (RLS applies). The migration password reaches only db-init
#   and migrate.
# - The values the API refuses outside local (docs/security.md#startup-policy) are not
#   used: https origins and issuer, OIDC, PostgreSQL, rate limiting on, no compose
#   development credentials.
# - Every image runs on linux/arm64 and linux/amd64; images are built on the VM.

name: anum

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# The API image, built once and shared by migrate, api and the retention job.
x-api-build: &api-build
  context: ../../services/api

services:
  # --- Reverse proxy: the only container with published ports ----------------------
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    # TCP only: HTTP/3 (UDP 443) is turned off in the Caddyfile, so the Oracle security
    # list needs TCP 80 and 443 only.
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in infra/oracle/.env}
      ANUM_WEB_HOST: ${ANUM_WEB_HOST:?set ANUM_WEB_HOST in infra/oracle/.env}
      ANUM_API_HOST: ${ANUM_API_HOST:?set ANUM_API_HOST in infra/oracle/.env}
      ANUM_AUTH_HOST: ${ANUM_AUTH_HOST:?set ANUM_AUTH_HOST in infra/oracle/.env}
      # Addresses allowed to open Keycloak's admin console and master realm: comma-
      # separated addresses or CIDR ranges; empty closes the console to the internet
      # (configure_env.py --check validates the list; docs/deploy-oracle.md#keycloak).
      ANUM_KEYCLOAK_ADMIN_ALLOWED_IPS: ${ANUM_KEYCLOAK_ADMIN_ALLOWED_IPS:-}
      # Optional sites of the `monitoring` profile (monitoring.caddy). Empty until
      # monitoring.sh enable sets them; the sites are imported only while enabled.
      ANUM_MONITOR_HOST: ${ANUM_MONITOR_HOST:-}
      ANUM_ERRORS_HOST: ${ANUM_ERRORS_HOST:-}
      ANUM_MONITORING_BASIC_AUTH_USER: ${ANUM_MONITORING_BASIC_AUTH_USER:-}
      ANUM_MONITORING_BASIC_AUTH_HASH: ${ANUM_MONITORING_BASIC_AUTH_HASH:-}
    # The Caddyfile's remote_ip matcher takes space-separated ranges and needs at least
    # one: commas become spaces, and an empty list becomes 0.0.0.0/32 ::/128, which no
    # TCP peer can have (admin console closed). Overriding the entrypoint clears the
    # image's CMD: repeat it.
    entrypoint:
      - sh
      - -c
      - >-
        ANUM_KEYCLOAK_ADMIN_ALLOWED_IPS="$$(printf '%s' "$${ANUM_KEYCLOAK_ADMIN_ALLOWED_IPS:-}" | tr ',' ' ' | xargs)";
        export ANUM_KEYCLOAK_ADMIN_ALLOWED_IPS="$${ANUM_KEYCLOAK_ADMIN_ALLOWED_IPS:-0.0.0.0/32 ::/128}";
        exec "$$@"
      - caddy-entrypoint
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # monitoring.sh enable puts an import of monitoring.caddy into sites-enabled/;
      # the Caddyfile imports sites-enabled/*.caddy (nothing while monitoring is off).
      - ./monitoring.caddy:/etc/caddy/sites-available/monitoring.caddy:ro
      - ./sites-enabled:/etc/caddy/sites-enabled:ro
      # Certificates and ACME account: keep this volume, or Let's Encrypt rate limits
      # apply on every re-issue.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        # Fixed address: the API (FORWARDED_ALLOW_IPS) and Keycloak
        # (KC_PROXY_TRUSTED_ADDRESSES) trust forwarded headers from this peer only.
        ipv4_address: 172.30.10.10
      # Other self-contained stacks on the same VM (docs/deploy-oracle.md#other-sites-on-the-same-vm)
      # join `anum_sites` as an external network; Caddy proxies to them through
      # sites-enabled/<name>.caddy. Caddy is the only ANUM service on it, and ANUM's
      # upstreams stay reachable over `edge` only, so the API and Keycloak still see
      # 172.30.10.10 as the peer.
      sites: {}
    depends_on:
      - web
      - api
      - keycloak
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 256m
    logging: *logging

  # --- PostgreSQL 17 with pgvector: ANUM's database and Keycloak's own database -----
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: unless-stopped
    environment:
      # The cluster superuser. Used only by db-init (role bootstrap) and the restore
      # tools (docs/deploy-oracle.md#backups); no application service receives it.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ANUM_POSTGRES_PASSWORD:?set ANUM_POSTGRES_PASSWORD in infra/oracle/.env}
      POSTGRES_DB: anum
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=peer"
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=100
      # GlitchTip (profile `monitoring`) partitions its event tables; queries over many
      # partitions lock each of them. 512 is GlitchTip's recommended floor; it costs a
      # few MB of shared memory whether or not monitoring is on.
      - -c
      - max_locks_per_transaction=512
      - -c
      - password_encryption=scram-sha-256
    shm_size: 512m
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d anum -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s
    # 1 GB shared buffers plus up to 100 backends; 3.5 GB keeps the default stack's
    # ceilings within 11 GB (docs/deploy-oracle.md#memory-budget).
    mem_limit: 3584m
    logging: *logging

  # One-shot, on every `up`: creates or updates the roles and Keycloak's database with
  # the passwords from .env (infra/oracle/db-init.sh). Idempotent.
  db-init:
    image: pgvector/pgvector:0.8.7-pg17-trixie
    restart: "no"
    entrypoint: ["/bin/sh", "/init/db-init.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${ANUM_POSTGRES_PASSWORD:?set ANUM_POSTGRES_PASSWORD in infra/oracle/.env}
      ANUM_MIGRATOR_PASSWORD: ${ANUM_MIGRATOR_PASSWORD:?set ANUM_MIGRATOR_PASSWORD in infra/oracle/.env}
      ANUM_APP_PASSWORD: ${ANUM_APP_PASSWORD:?set ANUM_APP_PASSWORD in infra/oracle/.env}
      ANUM_RELAY_PASSWORD: ${ANUM_RELAY_PASSWORD:?set ANUM_RELAY_PASSWORD in infra/oracle/.env}
      ANUM_BACKUP_DB_PASSWORD: ${ANUM_BACKUP_DB_PASSWORD:?set ANUM_BACKUP_DB_PASSWORD in infra/oracle/.env}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in infra/oracle/.env}
      # Set by monitoring.sh enable: GlitchTip's own login and database (db/glitchtip.sql).
      # Empty: db-init creates nothing for GlitchTip.
      GLITCHTIP_DB_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-}
    volumes:
      - ./db-init.sh:/init/db-init.sh:ro
      - ./db:/init/db:ro
      - ../helm/bootstrap-database.sql:/init/bootstrap-database.sql:ro
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # One-shot, on every `up`: `alembic upgrade head` as the schema owner. The API starts
  # only after it succeeded. Migrations are expand/contract (docs/deployment.md#migrations).
  migrate:
    build: *api-build
    image: anum/api:local
    restart: "no"
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment:
      ANUM_ENVIRONMENT: ${ANUM_ENVIRONMENT:-staging}
      ANUM_REPOSITORY_BACKEND: postgresql
      ANUM_DATABASE_URL: postgresql+psycopg://anum_migrator:${ANUM_MIGRATOR_PASSWORD:?set ANUM_MIGRATOR_PASSWORD in infra/oracle/.env}@postgres:5432/anum
      ANUM_SECRETS_KEY: ${ANUM_SECRETS_KEY:?set ANUM_SECRETS_KEY in infra/oracle/.env}
    # The image's HEALTHCHECK probes the API port, which this job does not serve.
    healthcheck:
      disable: true
    networks:
      - backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    logging: *logging

  # --- API (FastAPI) ----------------------------------------------------------------
  api:
    build: *api-build
    image: anum/api:local
    restart: unless-stopped
    environment:
      # Only Caddy may set X-Forwarded-For/Proto (client IPs for rate limiting). Caddy
      # replaces any X-Forwarded-For a client sends (Caddyfile), so a client cannot
      # choose its own rate-limit bucket.
      FORWARDED_ALLOW_IPS: 172.30.10.10
      ANUM_ENVIRONMENT: ${ANUM_ENVIRONMENT:-staging}
      ANUM_AUTH_MODE: oidc
      ANUM_OIDC_AUDIENCE: anum-api
      # Exactly as Keycloak writes it into tokens (KC_HOSTNAME + /realms/anum).
      ANUM_KEYCLOAK_ISSUER: https://${ANUM_AUTH_HOST:?set ANUM_AUTH_HOST in infra/oracle/.env}/realms/anum
      # Signing keys fetched from Keycloak on the private network, not through the
      # public address (no hairpin through the VM's public IP).
      ANUM_OIDC_JWKS_URL: http://keycloak:8080/realms/anum/protocol/openid-connect/certs
      ANUM_CORS_ORIGINS: '["https://${ANUM_WEB_HOST:?set ANUM_WEB_HOST in infra/oracle/.env}"]'
      # What the sign-in screens offer (GET /api/v1/auth/sign-in-options): Keycloak
      # providers configured by keycloak-2fa.sh google|apple, its sign-up page, and the
      # privacy policy new accounts accept (docs/deploy-oracle.md#google-and-apple-sign-in).
      ANUM_SIGN_IN_PROVIDERS: ${ANUM_SIGN_IN_PROVIDERS:-}
      ANUM_SELF_SIGN_UP: ${ANUM_SELF_SIGN_UP:-false}
      ANUM_PRIVACY_POLICY_URL: ${ANUM_PRIVACY_POLICY_URL:-}
      # In-app calls between teammates (docs/in-app-calls.md). Off until calls.sh enable
      # fills ANUM_CALLS_TURN_URLS and starts the `calls` profile's coturn relay; the API
      # mints short-lived TURN credentials with ANUM_TURN_SECRET (generated by install.sh).
      ANUM_CALLS_TURN_URLS: ${ANUM_CALLS_TURN_URLS:-}
      ANUM_CALLS_TURN_SECRET: ${ANUM_TURN_SECRET:-}
      ANUM_CALLS_STUN_URLS: ${ANUM_CALLS_STUN_URLS:-}
      ANUM_CALLS_ALLOW_STUN_ONLY: ${ANUM_CALLS_ALLOW_STUN_ONLY:-false}
      ANUM_REPOSITORY_BACKEND: postgresql
      ANUM_DATABASE_URL: postgresql+psycopg://anum_app:${ANUM_APP_PASSWORD:?set ANUM_APP_PASSWORD in infra/oracle/.env}@postgres:5432/anum
      # Comma-separated Fernet keys (first one encrypts), generated by install.sh.
      ANUM_SECRETS_KEY: ${ANUM_SECRETS_KEY:?set ANUM_SECRETS_KEY in infra/oracle/.env}
      # No NATS and no Temporal on this path: events stay in PostgreSQL (SSE reads them)
      # and agent runs execute inside the API request, as on Render.
      ANUM_EVENT_BUS: memory
      ANUM_RUNTIME_BACKEND: inline
      ANUM_VALKEY_URL: redis://valkey:6379/0
      ANUM_RUN_LOCK_BACKEND: valkey
      ANUM_RATE_LIMIT_BACKEND: valkey
      ANUM_RATE_LIMIT_ENABLED: "true"
      # Workspace files in an external S3-compatible bucket with versioning (Backblaze
      # B2 or AWS S3; docs/deploy-oracle.md#file-storage).
      ANUM_OBJECT_STORAGE_BACKEND: s3
      ANUM_S3_ENDPOINT: ${ANUM_S3_ENDPOINT:?set ANUM_S3_ENDPOINT in infra/oracle/.env}
      ANUM_S3_REGION: ${ANUM_S3_REGION:?set ANUM_S3_REGION in infra/oracle/.env}
      ANUM_S3_BUCKET: ${ANUM_S3_BUCKET:?set ANUM_S3_BUCKET in infra/oracle/.env}
      ANUM_S3_ACCESS_KEY: ${ANUM_S3_ACCESS_KEY:?set ANUM_S3_ACCESS_KEY in infra/oracle/.env}
      ANUM_S3_SECRET_KEY: ${ANUM_S3_SECRET_KEY:?set ANUM_S3_SECRET_KEY in infra/oracle/.env}
      ANUM_S3_SERVER_SIDE_ENCRYPTION: AES256
      ANUM_S3_CREATE_BUCKET: "false"
      # Staging starts on the mock model. For Ollama (the `ai` profile) or a hosted
      # provider, change these in .env (docs/deploy-oracle.md#ai-model).
      ANUM_MODEL_PROVIDER: ${ANUM_MODEL_PROVIDER:-mock}
      ANUM_MODEL_NAME: ${ANUM_MODEL_NAME:-gpt-4.1-mini}
      ANUM_MODEL_BASE_URL: ${ANUM_MODEL_BASE_URL:-https://api.openai.com/v1}
      ANUM_MODEL_API_KEY: ${ANUM_MODEL_API_KEY:-}
      # Operator allow-list for a private model host, `ollama:11434` with the ai profile.
      ANUM_MODEL_ALLOWED_HOSTS: ${ANUM_MODEL_ALLOWED_HOSTS:-}
      ANUM_MODEL_TIMEOUT_SECONDS: ${ANUM_MODEL_TIMEOUT_SECONDS:-60}
      # Model routing (docs/model-gateway.md#model-routing); empty names keep
      # ANUM_MODEL_NAME. An empty effort sends none, so it is not defaulted when empty.
      ANUM_MODEL_FAST_NAME: ${ANUM_MODEL_FAST_NAME:-}
      ANUM_MODEL_CAPABLE_NAME: ${ANUM_MODEL_CAPABLE_NAME:-}
      ANUM_MODEL_FAST_EFFORT: ${ANUM_MODEL_FAST_EFFORT-low}
      ANUM_MODEL_CAPABLE_EFFORT: ${ANUM_MODEL_CAPABLE_EFFORT-}
      # Voice calls (docs/voice.md#call-mode): the camera's vision model and optional
      # server speech (OpenAI audio API: OpenAI or a self-hosted Whisper/Piper server).
      ANUM_MODEL_VISION_NAME: ${ANUM_MODEL_VISION_NAME:-}
      ANUM_SPEECH_STT_BASE_URL: ${ANUM_SPEECH_STT_BASE_URL:-}
      ANUM_SPEECH_STT_API_KEY: ${ANUM_SPEECH_STT_API_KEY:-}
      ANUM_SPEECH_STT_MODEL: ${ANUM_SPEECH_STT_MODEL:-}
      ANUM_SPEECH_STT_USD_PER_MINUTE: ${ANUM_SPEECH_STT_USD_PER_MINUTE:-0}
      ANUM_SPEECH_TTS_BASE_URL: ${ANUM_SPEECH_TTS_BASE_URL:-}
      ANUM_SPEECH_TTS_API_KEY: ${ANUM_SPEECH_TTS_API_KEY:-}
      ANUM_SPEECH_TTS_MODEL: ${ANUM_SPEECH_TTS_MODEL:-}
      ANUM_SPEECH_TTS_VOICE_EN: ${ANUM_SPEECH_TTS_VOICE_EN:-}
      ANUM_SPEECH_TTS_VOICE_AR: ${ANUM_SPEECH_TTS_VOICE_AR:-}
      ANUM_SPEECH_TTS_USD_PER_MILLION_CHARS: ${ANUM_SPEECH_TTS_USD_PER_MILLION_CHARS:-0}
      # Fires due automation schedules; anum_app is granted anum_maintenance by the
      # bootstrap (WITH INHERIT FALSE, SET TRUE).
      ANUM_AUTOMATION_SCHEDULER_ENABLED: "true"
      # Private web search (the searxng service below); a workspace owner can switch
      # the web_search tool off under Integrations.
      ANUM_SEARXNG_URL: http://searxng:8080
      # Upload malware scanning (docs/files.md#malware-scanning): every upload and email
      # attachment goes to the clamd service below; while clamd is down or still loading
      # its signatures, uploads fail with 503 and nothing is stored (fail closed).
      ANUM_FILE_SCANNER: clamav
      ANUM_CLAMAV_HOST: clamd
      ANUM_CLAMAV_PORT: "3310"
      ANUM_CLAMAV_TIMEOUT_SECONDS: "30"
      ANUM_FILE_SCAN_REQUIRED: "true"
      # Unified inbox (docs/email.md): the owner's own OAuth clients; a provider stays
      # "not set up" while its client id or secret is empty. The redirect URI to
      # register is https://<API>/api/v1/email/oauth/callback.
      ANUM_EMAIL_PUBLIC_API_URL: https://${ANUM_API_HOST}
      ANUM_EMAIL_WEB_URL: https://${ANUM_WEB_HOST}
      ANUM_EMAIL_GOOGLE_CLIENT_ID: ${ANUM_EMAIL_GOOGLE_CLIENT_ID:-}
      ANUM_EMAIL_GOOGLE_CLIENT_SECRET: ${ANUM_EMAIL_GOOGLE_CLIENT_SECRET:-}
      ANUM_EMAIL_MICROSOFT_CLIENT_ID: ${ANUM_EMAIL_MICROSOFT_CLIENT_ID:-}
      ANUM_EMAIL_MICROSOFT_CLIENT_SECRET: ${ANUM_EMAIL_MICROSOFT_CLIENT_SECRET:-}
      ANUM_EMAIL_MICROSOFT_TENANT: ${ANUM_EMAIL_MICROSOFT_TENANT:-common}
      ANUM_EMAIL_ZOHO_CLIENT_ID: ${ANUM_EMAIL_ZOHO_CLIENT_ID:-}
      ANUM_EMAIL_ZOHO_CLIENT_SECRET: ${ANUM_EMAIL_ZOHO_CLIENT_SECRET:-}
      ANUM_EMAIL_ZOHO_DATA_CENTRE: ${ANUM_EMAIL_ZOHO_DATA_CENTRE:-com}
      # Background sync of connected mailboxes (anum_maintenance discovers them); 0 is off.
      ANUM_EMAIL_SYNC_INTERVAL_SECONDS: ${ANUM_EMAIL_SYNC_INTERVAL_SECONDS:-300}
      # WhatsApp (docs/whatsapp.md): credentials are per workspace, encrypted in the
      # database. Message history kept for workspaces that chose no retention, in days
      # (0 keeps it); the retention job below deletes older messages.
      ANUM_WHATSAPP_MESSAGE_RETENTION_DAYS: ${ANUM_WHATSAPP_MESSAGE_RETENTION_DAYS:-0}
      ANUM_WHATSAPP_TRIAGE_ON_ARRIVAL: ${ANUM_WHATSAPP_TRIAGE_ON_ARRIVAL:-true}
      # What ANUM learned (docs/learning.md): false stops new learning; feedback signals
      # older than the retention (7 to 3650 days) are deleted as they are used.
      ANUM_LEARNING_ENABLED: ${ANUM_LEARNING_ENABLED:-true}
      ANUM_LEARNING_SIGNAL_RETENTION_DAYS: ${ANUM_LEARNING_SIGNAL_RETENTION_DAYS:-180}
      # Errors to GlitchTip (profile `monitoring`) or any Sentry-compatible server; empty
      # is off. monitoring.sh sets http://<key>@glitchtip:8000/<project> (the private
      # network, no hairpin through the public address). Scrubbed to types, frames,
      # routes and the tenant id (docs/observability.md#error-reporting).
      ANUM_SENTRY_DSN: ${ANUM_SENTRY_DSN:-}
      # Phone push through Firebase Cloud Messaging; empty is off (docs/notifications.md).
      ANUM_FCM_SERVICE_ACCOUNT_JSON: ${ANUM_FCM_SERVICE_ACCOUNT_JSON:-}
      # Owner integrations (docs/integrations-setup.md). Each one stays "not set up" under
      # Integrations > Connection setup until its values are filled in infra/oracle/.env.
      # Notification email (docs/team-work.md#notifications); empty host is off.
      ANUM_SMTP_HOST: ${ANUM_SMTP_HOST:-}
      ANUM_SMTP_PORT: ${ANUM_SMTP_PORT:-587}
      ANUM_SMTP_SECURITY: ${ANUM_SMTP_SECURITY:-starttls}
      ANUM_SMTP_USERNAME: ${ANUM_SMTP_USERNAME:-}
      ANUM_SMTP_PASSWORD: ${ANUM_SMTP_PASSWORD:-}
      ANUM_SMTP_FROM: ${ANUM_SMTP_FROM:-}
      # Email Center: the own mail server over IMAPS and SMTP (docs/email.md#email-center).
      ANUM_MAILSERVER_ENABLED: ${ANUM_MAILSERVER_ENABLED:-false}
      ANUM_MAILSERVER_IMAP_HOST: ${ANUM_MAILSERVER_IMAP_HOST:-}
      ANUM_MAILSERVER_IMAP_PORT: ${ANUM_MAILSERVER_IMAP_PORT:-993}
      ANUM_MAILSERVER_SMTP_HOST: ${ANUM_MAILSERVER_SMTP_HOST:-}
      ANUM_MAILSERVER_SMTP_PORT: ${ANUM_MAILSERVER_SMTP_PORT:-587}
      ANUM_MAILSERVER_SMTP_SECURITY: ${ANUM_MAILSERVER_SMTP_SECURITY:-starttls}
      ANUM_MAILSERVER_ALLOWED_DOMAINS: ${ANUM_MAILSERVER_ALLOWED_DOMAINS:-anum360os.com}
      ANUM_MAILSERVER_ALLOWED_TENANTS: ${ANUM_MAILSERVER_ALLOWED_TENANTS:-}
      # Optional read-only Mailcow API for the operator's mail health view (docs/email.md#operator-view).
      ANUM_MAILCOW_API_ENABLED: ${ANUM_MAILCOW_API_ENABLED:-false}
      ANUM_MAILCOW_API_URL: ${ANUM_MAILCOW_API_URL:-}
      ANUM_MAILCOW_API_KEY: ${ANUM_MAILCOW_API_KEY:-}
      # Mail domains and aliases from the platform console, after approval (docs/email.md#mail-domains).
      ANUM_MAILCOW_WRITE_ENABLED: ${ANUM_MAILCOW_WRITE_ENABLED:-false}
      ANUM_MAILCOW_API_WRITE_KEY: ${ANUM_MAILCOW_API_WRITE_KEY:-}
      ANUM_MAILCOW_MAIL_HOST: ${ANUM_MAILCOW_MAIL_HOST:-}
      # Meeting recordings to text (docs/meetings.md); none = transcript files only.
      ANUM_TRANSCRIPTION_PROVIDER: ${ANUM_TRANSCRIPTION_PROVIDER:-none}
      ANUM_TRANSCRIPTION_BASE_URL: ${ANUM_TRANSCRIPTION_BASE_URL:-}
      ANUM_TRANSCRIPTION_MODEL: ${ANUM_TRANSCRIPTION_MODEL:-}
      ANUM_TRANSCRIPTION_API_KEY: ${ANUM_TRANSCRIPTION_API_KEY:-}
      # Zoom and Teams transcripts (docs/meetings.md#connectors). The redirect URL to
      # register with both apps is the web app's /meetings/connected page.
      ANUM_MEETINGS_OAUTH_REDIRECT_URI: https://${ANUM_WEB_HOST}/meetings/connected
      ANUM_ZOOM_CLIENT_ID: ${ANUM_ZOOM_CLIENT_ID:-}
      ANUM_ZOOM_CLIENT_SECRET: ${ANUM_ZOOM_CLIENT_SECRET:-}
      ANUM_MICROSOFT_CLIENT_ID: ${ANUM_MICROSOFT_CLIENT_ID:-}
      ANUM_MICROSOFT_CLIENT_SECRET: ${ANUM_MICROSOFT_CLIENT_SECRET:-}
      ANUM_MICROSOFT_TENANT: ${ANUM_MICROSOFT_TENANT:-organizations}
      # Social media marketing (docs/marketing.md). Register the web app's
      # /marketing/callback page as the redirect URL in every platform app.
      ANUM_MARKETING_OAUTH_REDIRECT_URL: https://${ANUM_WEB_HOST}/marketing/callback
      ANUM_MARKETING_PUBLIC_API_URL: https://${ANUM_API_HOST}
      ANUM_MARKETING_META_APP_ID: ${ANUM_MARKETING_META_APP_ID:-}
      ANUM_MARKETING_META_APP_SECRET: ${ANUM_MARKETING_META_APP_SECRET:-}
      ANUM_MARKETING_LINKEDIN_CLIENT_ID: ${ANUM_MARKETING_LINKEDIN_CLIENT_ID:-}
      ANUM_MARKETING_LINKEDIN_CLIENT_SECRET: ${ANUM_MARKETING_LINKEDIN_CLIENT_SECRET:-}
      ANUM_MARKETING_X_CLIENT_ID: ${ANUM_MARKETING_X_CLIENT_ID:-}
      ANUM_MARKETING_X_CLIENT_SECRET: ${ANUM_MARKETING_X_CLIENT_SECRET:-}
      ANUM_MARKETING_TIKTOK_CLIENT_KEY: ${ANUM_MARKETING_TIKTOK_CLIENT_KEY:-}
      ANUM_MARKETING_TIKTOK_CLIENT_SECRET: ${ANUM_MARKETING_TIKTOK_CLIENT_SECRET:-}
      ANUM_MARKETING_TIKTOK_DIRECT_POST: ${ANUM_MARKETING_TIKTOK_DIRECT_POST:-false}
      ANUM_MARKETING_GOOGLE_CLIENT_ID: ${ANUM_MARKETING_GOOGLE_CLIENT_ID:-}
      ANUM_MARKETING_GOOGLE_CLIENT_SECRET: ${ANUM_MARKETING_GOOGLE_CLIENT_SECRET:-}
      # Sales channels sync in the background (docs/commerce.md); false = "Sync now" only.
      ANUM_COMMERCE_SYNC_ENABLED: ${ANUM_COMMERCE_SYNC_ENABLED:-false}
      # Read-only finance connections (ECB exchange rates) sync in the background (docs/finance.md#sync).
      ANUM_FINANCE_SYNC_ENABLED: ${ANUM_FINANCE_SYNC_ENABLED:-false}
      # The outbound REST webhook behind the external.action tool (always approved).
      ANUM_EXTERNAL_WEBHOOK_URL: ${ANUM_EXTERNAL_WEBHOOK_URL:-}
      ANUM_EXTERNAL_WEBHOOK_API_KEY: ${ANUM_EXTERNAL_WEBHOOK_API_KEY:-}
      # Developer mode (docs/developer-mode.md): your organization and, optionally, one
      # workspace; the GitHub token can also be stored per project in the app.
      ANUM_DEVELOPER_TENANT_ID: ${ANUM_DEVELOPER_TENANT_ID:-}
      ANUM_DEVELOPER_WORKSPACE_ID: ${ANUM_DEVELOPER_WORKSPACE_ID:-}
      ANUM_DEVELOPER_GITHUB_TOKEN: ${ANUM_DEVELOPER_GITHUB_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - edge
      - backend
      - egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    stop_grace_period: 30s
    mem_limit: 2g
    logging: *logging

  # --- Web client (Vite bundle on unprivileged nginx) -------------------------------
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      # Compiled into the bundle; not secret.
      args:
        VITE_ANUM_API_URL: https://${ANUM_API_HOST:?set ANUM_API_HOST in infra/oracle/.env}
        VITE_ANUM_OIDC_ISSUER: https://${ANUM_AUTH_HOST:?set ANUM_AUTH_HOST in infra/oracle/.env}/realms/anum
        VITE_ANUM_OIDC_CLIENT_ID: anum-web
        # Optional browser error reporting to GlitchTip (docs/monitoring-oracle.md#web-errors):
        # the project's public DSN, https://<key>@<ANUM_ERRORS_HOST>/<id>. Empty: off, and the
        # bundle has no reporting code. Its origin is added to the CSP's connect-src at build.
        VITE_SENTRY_DSN: ${ANUM_WEB_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${ANUM_ENVIRONMENT:-staging}
        # Legal pages shown without the DRAFT banner (docs/legal-pages.md): terms, privacy,
        # dpa, aup, subprocessors (comma-separated) or all. Empty: every page is a draft.
        VITE_ANUM_LEGAL_PUBLISHED: ${ANUM_LEGAL_PUBLISHED:-}
    image: anum/web:local
    restart: unless-stopped
    environment:
      # Origins the page may call besides itself, substituted into the CSP at start.
      ANUM_CSP_CONNECT_SRC: https://${ANUM_API_HOST} https://${ANUM_AUTH_HOST}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge
    mem_limit: 256m
    logging: *logging

  # --- Keycloak (identity provider) -------------------------------------------------
  keycloak:
    build:
      context: ../..
      dockerfile: infra/render/keycloak.Dockerfile
      # Optional "Sign in with Apple" extension jar and its SHA-256 (docs/identity.md#apple);
      # empty builds Keycloak without it.
      args:
        APPLE_PROVIDER_URL: ${ANUM_KEYCLOAK_APPLE_PROVIDER_URL:-}
        APPLE_PROVIDER_SHA256: ${ANUM_KEYCLOAK_APPLE_PROVIDER_SHA256:-}
    image: anum/keycloak:local
    restart: unless-stopped
    environment:
      # Public URL; every URL Keycloak builds (and the token issuer) comes from it.
      KC_HOSTNAME: https://${ANUM_AUTH_HOST:?set ANUM_AUTH_HOST in infra/oracle/.env}
      # Fills ${ANUM_WEB_ORIGIN} in the realm's web client on the first start.
      ANUM_WEB_ORIGIN: https://${ANUM_WEB_HOST:?set ANUM_WEB_HOST in infra/oracle/.env}
      # The image sets KC_PROXY_HEADERS=xforwarded; only Caddy's address may send them.
      KC_PROXY_TRUSTED_ADDRESSES: 172.30.10.10/32
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      # Keycloak's own login: owns only the keycloak database, no ANUM role.
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set KEYCLOAK_DB_PASSWORD in infra/oracle/.env}
      # One-time bootstrap admin of the master realm, used only on the first start.
      # Replace it with a named admin with MFA on day one, then empty both values in
      # .env, keeping the lines (docs/deploy-oracle.md#keycloak).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Read by the entrypoint only: with no allow-list, Caddy closes the admin console
      # and it is opened through an SSH tunnel to this container
      # (ssh -L 8080:172.30.10.20:8080), so Keycloak builds the console's URLs for
      # http://localhost:8080 (KC_HOSTNAME_ADMIN). Sign-in URLs and the token issuer
      # of the anum realm stay on KC_HOSTNAME.
      ADMIN_CONSOLE_ALLOWED_IPS: ${ANUM_KEYCLOAK_ADMIN_ALLOWED_IPS:-}
    # Keycloak refuses to start when the bootstrap variables are set but empty
    # ("bootstrap-admin-username available only when bootstrap admin password is set"),
    # so drop them once the password has been emptied. Overriding the entrypoint also
    # clears the image's CMD: repeat it.
    entrypoint:
      - bash
      - -c
      - >-
        [ -n "$${KC_BOOTSTRAP_ADMIN_PASSWORD:-}" ] ||
        unset KC_BOOTSTRAP_ADMIN_USERNAME KC_BOOTSTRAP_ADMIN_PASSWORD;
        [[ "$${ADMIN_CONSOLE_ALLOWED_IPS:-}" =~ [0-9A-Fa-f] ]] ||
        export KC_HOSTNAME_ADMIN=http://localhost:8080;
        unset ADMIN_CONSOLE_ALLOWED_IPS;
        exec /opt/keycloak/bin/kc.sh "$$@"
      - kc.sh
    command: ["start", "--optimized", "--import-realm"]
    healthcheck:
      # The image has no curl or wget; bash reads the management port's readiness.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      edge:
        # Fixed address: the target of the admin SSH tunnel (docs/deploy-oracle.md#keycloak).
        # Reachable from the VM itself only; no port is published.
        ipv4_address: 172.30.10.20
      backend: {}
      egress: {}
    depends_on:
      db-init:
        condition: service_completed_successfully
    # Keycloak sizes its heap from this limit (70%).
    mem_limit: 2g
    logging: *logging

  # --- Valkey (rate limits shared across workers, run locks) ------------------------
  valkey:
    image: valkey/valkey:9.1-alpine
    restart: unless-stopped
    # Short-lived counters and locks only: no persistence, and never evict a lock.
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    networks:
      - backend
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 384m
    logging: *logging

  # --- SearXNG (private web search for the `web_search` tool) ------------------------
  # No published port and no Caddy route: the API calls it on the internal backend
  # network as http://searxng:8080; egress lets it query the search engines
  # (docs/tools-and-integrations.md#web-search).
  searxng:
    image: searxng/searxng:2026.10.4-d48c4b555
    restart: unless-stopped
    environment:
      # Signs SearXNG's cookies and tokens; generated by install.sh / configure_env.py.
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in infra/oracle/.env}
      # settings.yml is mounted read-only: do not chown it.
      FORCE_OWNERSHIP: "false"
    volumes:
      - ../searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - backend
      - egress
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/searxng/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    logging: *logging

  # --- ClamAV clamd (upload malware scanning) ----------------------------------------
  # No published port and no Caddy route: the API streams each upload to
  # clamd:3310 (INSTREAM) on the internal backend network; egress lets freshclam fetch
  # signature updates. clamd keeps one copy of the signatures in memory (about 1.2 GB):
  # ConcurrentDatabaseReload no reloads in place instead of loading a second copy, and
  # freshclam does not load a downloaded set to test it (TestDatabases no; the files are
  # still signature-checked), so 2 GB is enough (docs/deploy-oracle.md#memory-budget).
  clamd:
    image: clamav/clamav:1.5.4-debian13-slim
    restart: unless-stopped
    environment:
      # Uploads are at most 25 MiB (ANUM_MAX_UPLOAD_BODY_BYTES): clamd accepts a stream
      # slightly larger, so a full-size upload is scanned instead of refused.
      CLAMD_CONF_StreamMaxLength: 26M
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
      CLAMD_CONF_MaxThreads: "4"
      FRESHCLAM_CONF_TestDatabases: "no"
      # Signature updates twice a day.
      FRESHCLAM_CHECKS: "2"
    volumes:
      - clamav-db:/var/lib/clamav
    networks:
      - backend
      - egress
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first start loads (or downloads) the signature database.
      start_period: 600s
    mem_limit: 2g
    # Loading signatures is single-threaded; one core keeps scans of large files from
    # starving PostgreSQL and the API on a 2 OCPU VM.
    cpus: 1.0
    logging: *logging

  # --- Scheduled jobs (profile `jobs`; started by systemd timers, never by `up`) ----
  # Daily retention (anum-retention.timer): voice transcripts, retrieval index rows,
  # idle conversations and WhatsApp messages past their workspace's retention.
  retention:
    profiles: ["jobs"]
    build: *api-build
    image: anum/api:local
    restart: "no"
    command: ["python", "-m", "anum_api.voice_retention"]
    environment:
      ANUM_ENVIRONMENT: ${ANUM_ENVIRONMENT:-staging}
      ANUM_REPOSITORY_BACKEND: postgresql
      # The application login (RLS applies), never the migration login.
      ANUM_DATABASE_URL: postgresql+psycopg://anum_app:${ANUM_APP_PASSWORD:?set ANUM_APP_PASSWORD in infra/oracle/.env}@postgres:5432/anum
      ANUM_SECRETS_KEY: ${ANUM_SECRETS_KEY:?set ANUM_SECRETS_KEY in infra/oracle/.env}
      # The same default as the API: workspaces without their own WhatsApp retention.
      ANUM_WHATSAPP_MESSAGE_RETENTION_DAYS: ${ANUM_WHATSAPP_MESSAGE_RETENTION_DAYS:-0}
    healthcheck:
      disable: true
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # Nightly logical backup with infra/backup/anum_backup.py as anum_backup (BYPASSRLS,
  # pg_read_all_data; a login nothing else uses), into ANUM_BACKUP_DIR (anum-backup.timer
  # runs infra/oracle/backup.sh).
  backup:
    profiles: ["jobs"]
    build:
      context: ../backup
    image: anum/backup:local
    restart: "no"
    command: ["backup", "--out", "/backups/anum"]
    environment:
      ANUM_BACKUP_DATABASE_URL: postgresql://anum_backup:${ANUM_BACKUP_DB_PASSWORD:?set ANUM_BACKUP_DB_PASSWORD in infra/oracle/.env}@postgres:5432/anum
      # The same login for pg_dump of Keycloak's database (backup.sh).
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: anum_backup
      PGPASSWORD: ${ANUM_BACKUP_DB_PASSWORD:?set ANUM_BACKUP_DB_PASSWORD in infra/oracle/.env}
    volumes:
      - ${ANUM_BACKUP_DIR:-/var/lib/anum/backups}:/backups
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # Restore, verify and the restore drill (backup.sh drill|restore|restore-keycloak).
  # Needs the cluster superuser to create anum_restore_* scratch databases.
  restore-tools:
    profiles: ["jobs"]
    build:
      context: ../backup
    image: anum/backup:local
    restart: "no"
    command: ["--help"]
    environment:
      ANUM_BACKUP_DATABASE_URL: postgresql://anum_backup:${ANUM_BACKUP_DB_PASSWORD:?set ANUM_BACKUP_DB_PASSWORD in infra/oracle/.env}@postgres:5432/anum
      ANUM_RESTORE_ADMIN_URL: postgresql://postgres:${ANUM_POSTGRES_PASSWORD:?set ANUM_POSTGRES_PASSWORD in infra/oracle/.env}@postgres:5432/postgres
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${ANUM_POSTGRES_PASSWORD:?set ANUM_POSTGRES_PASSWORD in infra/oracle/.env}
    volumes:
      - ${ANUM_BACKUP_DIR:-/var/lib/anum/backups}:/backups
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # Copies the dumps to the off-site bucket, encrypted on the VM first (rclone crypt with
  # ANUM_BACKUP_ENCRYPTION_PASSPHRASE), then sent with B2/S3 server-side encryption too.
  backup-upload:
    profiles: ["jobs"]
    image: rclone/rclone:1.75.2
    restart: "no"
    user: "10001:10001"
    # rclone wants the crypt password obscured; it is derived here, from stdin, so it
    # never appears on a command line.
    entrypoint:
      - /bin/sh
      - -c
      - 'RCLONE_CONFIG_SEALED_PASSWORD="$$(printf %s "$$ANUM_BACKUP_ENCRYPTION_PASSPHRASE" | rclone obscure -)" && export RCLONE_CONFIG_SEALED_PASSWORD && exec rclone "$$@"'
      - rclone
    command: ["copy", "/backups", "sealed:", "--include", "/anum/**", "--include", "/keycloak/**"]
    environment:
      HOME: /tmp
      RCLONE_CONFIG: /tmp/rclone.conf
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: Other
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${ANUM_BACKUP_S3_ENDPOINT:?set ANUM_BACKUP_S3_ENDPOINT in infra/oracle/.env}
      RCLONE_CONFIG_OFFSITE_REGION: ${ANUM_BACKUP_S3_REGION:?set ANUM_BACKUP_S3_REGION in infra/oracle/.env}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${ANUM_BACKUP_S3_ACCESS_KEY:?set ANUM_BACKUP_S3_ACCESS_KEY in infra/oracle/.env}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${ANUM_BACKUP_S3_SECRET_KEY:?set ANUM_BACKUP_S3_SECRET_KEY in infra/oracle/.env}
      RCLONE_CONFIG_OFFSITE_SERVER_SIDE_ENCRYPTION: AES256
      # The bucket exists already and the key may not list or create buckets.
      RCLONE_CONFIG_OFFSITE_NO_CHECK_BUCKET: "true"
      RCLONE_CONFIG_SEALED_TYPE: crypt
      RCLONE_CONFIG_SEALED_REMOTE: offsite:${ANUM_BACKUP_S3_BUCKET:?set ANUM_BACKUP_S3_BUCKET in infra/oracle/.env}/anum-backups
      # File contents are encrypted; names stay readable so a restore can pick a date.
      RCLONE_CONFIG_SEALED_FILENAME_ENCRYPTION: "off"
      RCLONE_CONFIG_SEALED_DIRECTORY_NAME_ENCRYPTION: "false"
      ANUM_BACKUP_ENCRYPTION_PASSPHRASE: ${ANUM_BACKUP_ENCRYPTION_PASSPHRASE:?set ANUM_BACKUP_ENCRYPTION_PASSPHRASE in infra/oracle/.env}
    volumes:
      - ${ANUM_BACKUP_DIR:-/var/lib/anum/backups}:/backups
    networks:
      - egress
    logging: *logging

  # --- Optional local model (profile `ai`: COMPOSE_PROFILES=ai in .env) --------------
  # CPU only on the Ampere A1: small models answer, slowly (docs/deploy-oracle.md#ai-model).
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.40.3
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - backend
      - egress
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 12g
    logging: *logging

  # One-shot: pulls the chat model and the embedding model (retrieval uses
  # nomic-embed-text with Ollama). Re-runs on `up`; a model already present is kept.
  ollama-pull:
    profiles: ["ai"]
    image: ollama/ollama:0.40.3
    restart: "no"
    entrypoint: ["/bin/sh", "-c", 'ollama pull "$$OLLAMA_MODEL" && ollama pull nomic-embed-text']
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    networks:
      - backend
    depends_on:
      ollama:
        condition: service_healthy
    logging: *logging

  # --- Optional TURN relay for in-app calls (profile `calls`; docs/in-app-calls.md) -
  # coturn relays WebRTC media for teammates whose networks block a direct path. It is
  # the one service with host networking: a relay needs the VM's real UDP ports (a
  # published range of thousands of ports through docker-proxy is slow and fragile), and
  # it publishes nothing else. calls.sh enable opens TCP/UDP 3478 and the UDP relay range
  # in the host firewall (iptables ACCEPT before Oracle's REJECT rule) and prints the
  # Oracle security-list rules to add. Credentials are minted by the API (use-auth-secret),
  # so there are no TURN users or passwords. Relaying to private, loopback, link-local and
  # metadata addresses is refused, so the relay cannot reach the VM's own services.
  coturn:
    profiles: ["calls"]
    image: coturn/coturn:4.18.0-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      ANUM_TURN_SECRET: ${ANUM_TURN_SECRET:-}
      ANUM_TURN_REALM: ${ANUM_API_HOST:?set ANUM_API_HOST in infra/oracle/.env}
      ANUM_TURN_EXTERNAL_IP: ${ANUM_TURN_EXTERNAL_IP:-}
      ANUM_TURN_PRIVATE_IP: ${ANUM_TURN_PRIVATE_IP:-}
      ANUM_TURN_MIN_PORT: ${ANUM_TURN_MIN_PORT:-49160}
      ANUM_TURN_MAX_PORT: ${ANUM_TURN_MAX_PORT:-49200}
    # The configuration (with the secret) is written inside the container at start, never
    # on a command line where `ps` would show it.
    entrypoint:
      - sh
      - -c
      - >-
        set -eu;
        [ "$${#ANUM_TURN_SECRET}" -ge 32 ] || { echo "ANUM_TURN_SECRET is missing or shorter than 32 characters" >&2; exit 1; };
        [ -n "$${ANUM_TURN_EXTERNAL_IP}" ] || { echo "ANUM_TURN_EXTERNAL_IP is not set (run calls.sh enable)" >&2; exit 1; };
        mapping="$${ANUM_TURN_EXTERNAL_IP}";
        [ -z "$${ANUM_TURN_PRIVATE_IP}" ] || mapping="$${ANUM_TURN_EXTERNAL_IP}/$${ANUM_TURN_PRIVATE_IP}";
        umask 077;
        {
        echo "listening-port=3478";
        echo "fingerprint";
        echo "use-auth-secret";
        echo "static-auth-secret=$${ANUM_TURN_SECRET}";
        echo "realm=$${ANUM_TURN_REALM}";
        echo "external-ip=$${mapping}";
        echo "min-port=$${ANUM_TURN_MIN_PORT}";
        echo "max-port=$${ANUM_TURN_MAX_PORT}";
        echo "no-tls"; echo "no-dtls"; echo "no-cli"; echo "no-multicast-peers"; echo "no-rfc5780";
        echo "no-stun-backward-compatibility"; echo "response-origin-only-with-rfc5780";
        echo "stale-nonce=600"; echo "user-quota=12"; echo "total-quota=200";
        echo "denied-peer-ip=0.0.0.0-0.255.255.255";
        echo "denied-peer-ip=10.0.0.0-10.255.255.255";
        echo "denied-peer-ip=100.64.0.0-100.127.255.255";
        echo "denied-peer-ip=127.0.0.0-127.255.255.255";
        echo "denied-peer-ip=169.254.0.0-169.254.255.255";
        echo "denied-peer-ip=172.16.0.0-172.31.255.255";
        echo "denied-peer-ip=192.0.0.0-192.0.0.255";
        echo "denied-peer-ip=192.168.0.0-192.168.255.255";
        echo "denied-peer-ip=198.18.0.0-198.19.255.255";
        echo "denied-peer-ip=224.0.0.0-255.255.255.255";
        echo "denied-peer-ip=::1";
        echo "denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff";
        echo "denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff";
        [ -z "$${ANUM_TURN_PRIVATE_IP}" ] || echo "allowed-peer-ip=$${ANUM_TURN_PRIVATE_IP}";
        echo "log-file=stdout"; echo "simple-log"; echo "no-software-attribute";
        } > /tmp/turnserver.conf;
        exec turnserver -c /tmp/turnserver.conf --pidfile /tmp/turnserver.pid
    healthcheck:
      # A STUN binding request to the relay's own port.
      test: ["CMD-SHELL", "turnutils_stunclient -p 3478 127.0.0.1 >/dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    logging: *logging

  # --- Optional monitoring (profiles `monitoring` and `monitoring-agent`) -------------
  # Off by default. infra/oracle/monitoring.sh turns it on and off: it asks for two more
  # hostnames and a password for Caddy's basic auth, generates GlitchTip's secrets into
  # .env and adds the profiles to COMPOSE_PROFILES (docs/monitoring-oracle.md). Nothing
  # here publishes a port: Caddy serves both UIs on their own hostnames, behind basic
  # auth and each tool's own login. Memory limits keep the three containers under 1.4 GB.

  # Beszel hub: host metrics (CPU, memory, disk, load) with history and alerts.
  beszel:
    profiles: ["monitoring"]
    image: henrygd/beszel:0.20.0
    restart: unless-stopped
    environment:
      APP_URL: https://${ANUM_MONITOR_HOST:-}
      # The container view would show `docker inspect` output, environment (secrets)
      # included; there is no Docker socket anyway (see beszel-agent).
      CONTAINER_DETAILS: "false"
    volumes:
      - beszel-data:/beszel_data
    networks:
      - edge
      - monitoring
    healthcheck:
      # The image is FROM scratch: the hub binary checks itself.
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    logging: *logging

  # Beszel agent: connects out to the hub over the internal `monitoring` network (the
  # hub's WebSocket endpoint, with the system's token; the hub's public key verifies the
  # hub). Its own profile, because it cannot start before the hub has issued that key and
  # token (monitoring.sh agent). No Docker socket and no host /proc: either would give
  # it root-equivalent access or every container's environment. CPU, memory, load, disk
  # usage and disk I/O are the host's; network traffic is only the agent's own.
  beszel-agent:
    profiles: ["monitoring-agent"]
    image: henrygd/beszel-agent:0.20.0
    restart: unless-stopped
    environment:
      HUB_URL: http://beszel:8090
      KEY: ${BESZEL_AGENT_KEY:-}
      TOKEN: ${BESZEL_AGENT_TOKEN:-}
      # Empty turns the Docker client off (no socket is mounted).
      DOCKER_HOST: ""
      SYSTEM_NAME: ${BESZEL_SYSTEM_NAME:-anum-vm}
    volumes:
      # The agent's fingerprint, so the hub recognises it after a recreate.
      - beszel-agent-data:/var/lib/beszel-agent
    networks:
      - monitoring
    healthcheck:
      # Healthy while the hub connection is less than 90 seconds old.
      test: ["CMD", "/agent", "health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      beszel:
        condition: service_healthy
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    logging: *logging

  # GlitchTip: Sentry-compatible error tracking for the API (ANUM_SENTRY_DSN). Web,
  # ingest and the task worker in one process (GlitchTip's all-in-one mode). Its own
  # login and database in the existing PostgreSQL (db/glitchtip.sql, created by db-init
  # only when GLITCHTIP_DB_PASSWORD is set). No Valkey: cache and task queue live in its
  # database, so it can never fill the `noeviction` Valkey that holds the API's rate
  # limits and run locks. No e-mail: alerts go to webhooks.
  glitchtip:
    profiles: ["monitoring"]
    image: glitchtip/glitchtip:6.2.6
    restart: unless-stopped
    # Refuse to start on GlitchTip's built-in default secret key or without a database
    # password (monitoring.sh enable generates both).
    command:
      - sh
      - -c
      - >-
        if [ "$${#SECRET_KEY}" -lt 40 ] || [ -z "$${DATABASE_PASSWORD}" ] || [ "$${GLITCHTIP_DOMAIN}" = "https://" ]; then
        echo "glitchtip: run infra/oracle/monitoring.sh enable (secret key, database password or host missing)" >&2;
        exit 1; fi;
        exec ./bin/start.sh
    environment:
      SERVER_ROLE: all_in_one
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-}
      GLITCHTIP_DOMAIN: https://${ANUM_ERRORS_HOST:-}
      # The public host (through Caddy) and `glitchtip` (the API's DSN on the private
      # network); localhost for the health check.
      ALLOWED_HOSTS: ${ANUM_ERRORS_HOST:-},glitchtip,localhost
      CSRF_TRUSTED_ORIGINS: https://${ANUM_ERRORS_HOST:-}
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: glitchtip
      DATABASE_USER: glitchtip
      DATABASE_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-}
      DATABASE_POOL_MIN_SIZE: "1"
      DATABASE_POOL_MAX_SIZE: "5"
      # Empty disables Valkey (see above).
      VALKEY_URL: ""
      ENABLE_USER_REGISTRATION: "false"
      ENABLE_ORGANIZATION_CREATION: "false"
      GLITCHTIP_MAX_EVENT_LIFE_DAYS: ${GLITCHTIP_MAX_EVENT_LIFE_DAYS:-30}
      # One web worker, recycled before it reaches the memory limit (GlitchTip's own
      # default would allow 1 GiB, the whole limit). The embedded task worker runs two
      # tasks at a time.
      GRANIAN_WORKERS: "1"
      GRANIAN_WORKERS_MAX_RSS: "640"
      VTASKS_CONCURRENCY: "2"
    volumes:
      - glitchtip-uploads:/code/uploads
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      # The first start runs GlitchTip's migrations.
      start_period: 300s
    depends_on:
      db-init:
        condition: service_completed_successfully
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    logging: *logging

networks:
  # Caddy and the three services it proxies to. Not internal: Caddy's published ports
  # and its ACME (Let's Encrypt) traffic need it.
  edge:
    ipam:
      config:
        - subnet: 172.30.10.0/24
  # PostgreSQL, Valkey and the jobs. Internal: no route to or from the internet, and
  # Caddy is not on it.
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.30.20.0/24
  # Outbound internet for the containers that need it: the API (S3 bucket, model
  # provider), Keycloak (mail), the off-site backup upload, Ollama (model downloads),
  # SearXNG (the search engines it queries) and clamd (signature updates).
  egress:
    ipam:
      config:
        - subnet: 172.30.30.0/24
  # The Beszel hub and its agent (profiles `monitoring`, `monitoring-agent`). Internal:
  # the agent has no route to the internet.
  monitoring:
    internal: true
    ipam:
      config:
        - subnet: 172.30.40.0/24
  # Caddy and other stacks on the same VM (e.g. the `portfolio` compose project), which
  # join it as `external: true` with this fixed name. No ANUM service but Caddy is on
  # it. Not internal: those stacks need outbound access. Created (and removed) by this
  # compose project, so it exists after update.sh.
  sites:
    name: anum_sites
    ipam:
      config:
        - subnet: 172.30.50.0/24

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
  ollama-models:
  # ClamAV signatures (seeded from the image, refreshed by freshclam).
  clamav-db:
  # Monitoring data (monitoring.sh purge deletes them).
  beszel-data:
  beszel-agent-data:
  glitchtip-uploads:
