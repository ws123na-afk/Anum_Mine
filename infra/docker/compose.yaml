services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: anum
      POSTGRES_USER: anum
      POSTGRES_PASSWORD: anum
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  temporal:
    image: temporalio/auto-setup:1.25
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: anum
      POSTGRES_PWD: anum
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    depends_on:
      - postgres

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080"
    depends_on:
      - temporal

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    # Imports the `anum` realm from infra/keycloak on first start (existing realms are skipped).
    # Admin credentials and the realm's `dev` user password are DEV-ONLY placeholders.
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Pin the token issuer to http://localhost:8080/realms/anum even when other containers
      # reach Keycloak as http://keycloak:8080 (they should set ANUM_OIDC_JWKS_URL instead).
      KC_HOSTNAME: http://localhost:8080
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ../keycloak/anum-realm.json:/opt/keycloak/data/import/anum-realm.json:ro

  s3:
    # S3-compatible object storage (SeaweedFS). MinIO no longer publishes community
    # images. Credentials come from infra/seaweedfs/s3.json and are DEV-ONLY.
    image: chrislusf/seaweedfs:3.97
    # Small volumes keep the dev store light; SeaweedFS defaults to 30 GB volumes.
    command: ["server", "-dir=/data", "-master.volumeSizeLimitMB=128", "-volume.max=20", "-s3", "-s3.port=9000", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "9000:9000"
    volumes:
      - s3-data:/data
      - ../seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    # The base config only prints what it receives. With the observability profile set
    # ANUM_OTELCOL_OVERLAY=observability so the overlay sends traces to Tempo, metrics
    # to Prometheus and logs to Loki (docs/observability.md#local-stack).
    command:
      - "--config=/etc/otelcol/config.yaml"
      - "--config=/etc/otelcol/overlays/${ANUM_OTELCOL_OVERLAY:-none}.yaml"
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - ../observability/otel-collector:/etc/otelcol/overlays:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  # Local observability backends. Opt in with
  #   ANUM_OTELCOL_OVERLAY=observability docker compose -f infra/docker/compose.yaml --profile observability up
  # Grafana: http://localhost:3000 (anonymous viewer; dashboards from infra/observability).
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.5
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.retention.time=7d"
    volumes:
      - ../observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../observability/prometheus/alerts.yaml:/etc/prometheus/rules/alerts.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.9.5
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ../observability/loki/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.4.12
    environment:
      # Local only: anonymous read-only access, no sign-up, no usage reporting.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

  # Application containers. Opt in with `--profile app`; the default
  # `docker compose up` still starts infrastructure only (docs/infrastructure.md).
  api:
    profiles: ["app"]
    build:
      context: ../../services/api
    environment:
      ANUM_ENVIRONMENT: local
      ANUM_DATABASE_URL: postgresql+psycopg://anum:anum@postgres:5432/anum
      ANUM_REPOSITORY_BACKEND: memory
      ANUM_CORS_ORIGINS: '["http://localhost:4173","http://127.0.0.1:4173"]'
      ANUM_VALKEY_URL: redis://valkey:6379/0
      ANUM_NATS_URL: nats://nats:4222
      ANUM_TEMPORAL_TARGET: temporal:7233
      ANUM_S3_ENDPOINT: http://s3:9000
      # Durable runs (docs/agent-runtime.md): set ANUM_REPOSITORY_BACKEND=postgresql
      # (after `python -m alembic upgrade head`) and ANUM_RUNTIME_BACKEND=temporal on
      # both api and worker; the in-memory repository is not shared between them.
      ANUM_RUNTIME_BACKEND: inline
      # Telemetry goes to the collector (docs/observability.md); unset to turn it off.
      ANUM_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  # Temporal worker for durable agent runs: same image, different command.
  worker:
    profiles: ["app"]
    build:
      context: ../../services/api
    command: ["python", "-m", "anum_api.worker"]
    environment:
      ANUM_ENVIRONMENT: local
      ANUM_DATABASE_URL: postgresql+psycopg://anum:anum@postgres:5432/anum
      ANUM_REPOSITORY_BACKEND: memory
      ANUM_VALKEY_URL: redis://valkey:6379/0
      ANUM_NATS_URL: nats://nats:4222
      ANUM_TEMPORAL_TARGET: temporal:7233
      ANUM_TEMPORAL_TASK_QUEUE: anum-agent-runs
      ANUM_S3_ENDPOINT: http://s3:9000
      ANUM_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    # The image's HEALTHCHECK probes the API port, which the worker does not serve.
    healthcheck:
      disable: true
    restart: unless-stopped
    depends_on:
      - postgres
      - temporal

  web:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_ANUM_API_URL: http://localhost:8000
    environment:
      ANUM_CSP_CONNECT_SRC: http://localhost:8000
    ports:
      - "4173:8080"
    depends_on:
      - api

volumes:
  postgres-data:
  s3-data:
  nats-data:
  prometheus-data:
  tempo-data:
  loki-data:
  grafana-data:
