services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: anum
      POSTGRES_USER: anum
      POSTGRES_PASSWORD: anum
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  temporal:
    image: temporalio/auto-setup:1.25
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: anum
      POSTGRES_PWD: anum
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    depends_on:
      - postgres

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080"
    depends_on:
      - temporal

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    # --import-realm loads infra/docker/keycloak/anum-realm.json on startup:
    # an "anum" realm with tenant_id/workspace_id/roles claim mappers already
    # configured, matching what services/api/anum_api/oidc_auth.py expects.
    # See infra/docker/keycloak/README.md for how to get a test token from
    # it. This realm is for local dev/testing ONLY (plaintext seeded
    # passwords, sslRequired: none) - never reuse it in production.
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/anum-realm.json:/opt/keycloak/data/import/anum-realm.json:ro

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: anum
      MINIO_ROOT_PASSWORD: anum-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  api:
    build:
      # services/api/Dockerfile is self-contained (no monorepo dependency),
      # so its build context is services/api itself, not the repo root --
      # this differs from the `web` service below, which needs repo-root
      # context for its pnpm workspace dependency on packages/contracts.
      context: ../../services/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      ANUM_DATABASE_URL: postgresql+psycopg://anum:anum@postgres:5432/anum
      ANUM_REPOSITORY_BACKEND: postgresql
      ANUM_KEYCLOAK_ISSUER: http://keycloak:8080/realms/anum
      # Defaults to the Phase 1 stub-header auth path so this compose stack
      # is easy to hit locally (x-tenant-id/x-workspace-id/x-user-id/
      # x-user-roles headers, no token verification). To exercise the OIDC
      # path instead, set:
      #   ANUM_AUTH_MODE: oidc
      # Note that this compose file only starts a bare Keycloak instance
      # (see the `keycloak` service above) with no realm, client, or
      # tenant_id/workspace_id/roles claim mappers configured. Switching
      # ANUM_AUTH_MODE to "oidc" here will NOT work out of the box until
      # someone provisions a real realm/client and the matching claim
      # mappers in Keycloak, and points ANUM_OIDC_AUDIENCE / an issued
      # bearer token at it.
      ANUM_AUTH_MODE: stub_headers

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_ANUM_API_URL: http://localhost:8000
    ports:
      # 8081, not 5173 -- 5173 is reserved for the separate `pnpm dev`
      # local dev server, so the two don't collide or get confused.
      - "8081:80"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
