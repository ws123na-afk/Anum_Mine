services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: anum
      POSTGRES_USER: anum
      POSTGRES_PASSWORD: anum
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  temporal:
    image: temporalio/auto-setup:1.25
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: anum
      POSTGRES_PWD: anum
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    depends_on:
      - postgres

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080"
    depends_on:
      - temporal

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    # --import-realm loads infra/docker/keycloak/anum-realm.json on startup:
    # an "anum" realm with tenant_id/workspace_id/roles claim mappers already
    # configured, matching what services/api/anum_api/oidc_auth.py expects.
    # See infra/docker/keycloak/README.md for how to get a test token from
    # it. This realm is for local dev/testing ONLY (plaintext seeded
    # passwords, sslRequired: none) - never reuse it in production.
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/anum-realm.json:/opt/keycloak/data/import/anum-realm.json:ro

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: anum
      MINIO_ROOT_PASSWORD: anum-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  api:
    build:
      # services/api/Dockerfile is self-contained (no monorepo dependency),
      # so its build context is services/api itself, not the repo root --
      # this differs from the `web` service below, which needs repo-root
      # context for its pnpm workspace dependency on packages/contracts.
      context: ../../services/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - valkey
      - nats
      - temporal
      - minio
    environment:
      ANUM_DATABASE_URL: postgresql+psycopg://anum:anum@postgres:5432/anum
      ANUM_REPOSITORY_BACKEND: postgresql
      ANUM_KEYCLOAK_ISSUER: http://keycloak:8080/realms/anum
      # Defaults to the Phase 1 stub-header auth path so this compose stack
      # is easy to hit locally (x-tenant-id/x-workspace-id/x-user-id/
      # x-user-roles headers, no token verification). To exercise OIDC
      # instead, set ANUM_AUTH_MODE: oidc - the `keycloak` service above
      # auto-imports a realm (infra/docker/keycloak/anum-realm.json) with
      # the client/claim mappers already configured, so this genuinely
      # works locally; see infra/docker/keycloak/README.md for a curl
      # example to fetch a test token. That realm is dev/test only - see
      # infra/docker/keycloak/README.md#production for a real deployment.
      ANUM_AUTH_MODE: stub_headers
      # Off by default (matches the API's own default). Uncomment to test
      # the rate limiter locally; see docs/deployment.md's production
      # checklist and anum_api/rate_limit.py before relying on this beyond
      # a single instance.
      # ANUM_RATE_LIMIT_ENABLED: "true"
      # Phase 2 coordination/event-bus/workflow services (see settings.py's
      # comments on each) - active in this compose stack since the services
      # above already run either way; a bare `uvicorn --reload` with no env
      # file still defaults every one of these to off, unchanged.
      ANUM_VALKEY_URL: redis://valkey:6379/0
      ANUM_NATS_URL: nats://nats:4222
      # The API process itself runs the Temporal worker in-process (see
      # anum_api/workflows/worker.py) - no separate worker container needed
      # for this "Now"-scoped, single-instance deployment.
      ANUM_TEMPORAL_ADDRESS: temporal:7233
      # Matches the `minio` service's MINIO_ROOT_USER/MINIO_ROOT_PASSWORD
      # below - local dev/test credentials only, never reuse in production.
      ANUM_OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      # `minio` only resolves inside this Compose network - a browser
      # loading the `web` service below can't use it. The `minio` service's
      # 9000 port is also published to the host (see that service's
      # `ports:`), so presigned download URLs are signed for this host-
      # reachable address instead; see object_storage.py's
      # generate_presigned_download_url and its public_endpoint_url param.
      ANUM_OBJECT_STORAGE_PUBLIC_ENDPOINT_URL: http://localhost:9000
      ANUM_OBJECT_STORAGE_BUCKET: anum-files
      ANUM_OBJECT_STORAGE_ACCESS_KEY: anum
      ANUM_OBJECT_STORAGE_SECRET_KEY: anum-local-secret
      # The `web` service below is published on 8081, not the `pnpm dev`
      # server's 5173 - both need to be allowed so either one can call this
      # API from a browser (stub-header auth sends custom identity headers,
      # which require CORS preflight to succeed).
      ANUM_CORS_ORIGINS: '["http://localhost:8081","http://localhost:5173"]'

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_ANUM_API_URL: http://localhost:8000
    ports:
      # 8081, not 5173 -- 5173 is reserved for the separate `pnpm dev`
      # local dev server, so the two don't collide or get confused.
      - "8081:80"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
