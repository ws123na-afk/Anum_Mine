services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: anum
      POSTGRES_USER: anum
      POSTGRES_PASSWORD: anum
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  temporal:
    image: temporalio/auto-setup:1.25
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: anum
      POSTGRES_PWD: anum
      POSTGRES_SEEDS: postgres
    ports:
      - "7233:7233"
    depends_on:
      - postgres

  temporal-ui:
    image: temporalio/ui:2.31.2
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8233:8080"
    depends_on:
      - temporal

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: anum
      MINIO_ROOT_PASSWORD: anum-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"

  # Application containers. Opt in with `--profile app`; the default
  # `docker compose up` still starts infrastructure only (docs/infrastructure.md).
  api:
    profiles: ["app"]
    build:
      context: ../../services/api
    environment:
      ANUM_ENVIRONMENT: local
      ANUM_DATABASE_URL: postgresql+psycopg://anum:anum@postgres:5432/anum
      ANUM_REPOSITORY_BACKEND: memory
      ANUM_CORS_ORIGINS: '["http://localhost:4173","http://127.0.0.1:4173"]'
      ANUM_VALKEY_URL: redis://valkey:6379/0
      ANUM_NATS_URL: nats://nats:4222
      ANUM_TEMPORAL_TARGET: temporal:7233
      ANUM_S3_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  web:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_ANUM_API_URL: http://localhost:8000
    environment:
      ANUM_CSP_CONNECT_SRC: http://localhost:8000
    ports:
      - "4173:8080"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
