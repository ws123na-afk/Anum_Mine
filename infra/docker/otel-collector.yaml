# OpenTelemetry Collector for local development (docs/observability.md).
#
# The API and worker export OTLP/HTTP here when ANUM_OTEL_EXPORTER_OTLP_ENDPOINT (or
# OTEL_EXPORTER_OTLP_ENDPOINT) is http://otel-collector:4318 inside compose, or
# http://localhost:4318 from the host. This base config prints a summary of what it
# receives (debug exporter). The `observability` compose profile merges
# infra/observability/otel-collector/observability.yaml on top of it, which sends
# traces to Tempo, metrics to Prometheus and logs to Loki; see compose.yaml.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  # Defence in depth: the SDK (anum_api/telemetry.py RedactingSpanExporter) already
  # strips query strings, credentials and client addresses. Anything that reaches the
  # collector from another emitter gets the same treatment before it is stored.
  transform/redact:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(attributes["http.url"], "\\?.*$", "")
          - replace_pattern(attributes["url.full"], "\\?.*$", "")
          - replace_pattern(attributes["http.target"], "\\?.*$", "")
  attributes/redact:
    actions:
      - key: url.query
        action: delete
      - key: client.address
        action: delete
      - key: net.peer.ip
        action: delete
      - key: network.peer.address
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: enduser.id
        action: delete
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/redact, attributes/redact, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [debug]
