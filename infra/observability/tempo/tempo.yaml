# Local Tempo (traces) for the `observability` compose profile. Single binary,
# local disk, three days of retention: development only (docs/observability.md).
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Tempo 3 removed the compactor: the backend worker runs retention (and
# compaction) jobs that the in-process backend scheduler hands out.
backend_worker:
  compaction:
    block_retention: 72h
