# Local Prometheus for the `observability` compose profile (docs/observability.md).
# Metrics reach it through the collector's Prometheus exporter; alert rules are in
# alerts.yaml and unit-tested by alerts.test.yaml (`promtool test rules`).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    anum_stack: local

rule_files:
  - /etc/prometheus/rules/alerts.yaml

scrape_configs:
  - job_name: otel-collector
    # Keep the job/instance labels the collector derives from service.name and
    # service.instance.id instead of overwriting them with the scrape target.
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
