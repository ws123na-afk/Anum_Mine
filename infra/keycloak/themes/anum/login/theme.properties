# ANUM login theme (docs/identity.md#self-sign-up). Keycloak 26's keycloak.v2 theme with
# one change: the password fields of the sign-up and change-password pages list the
# realm's password rules and tick each one while the person types
# (password-validation.ftl, resources/js/password-rules.js). The rules come from the
# realm's password policy at render time, so the page never shows a rule the server does
# not enforce. Installed by infra/render/keycloak.Dockerfile (Render and the Oracle VM);
# selected by `social_login.py enable-sign-up` (realm loginTheme = anum).
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/anum.css
