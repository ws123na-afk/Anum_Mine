# CI only: throwaway dependencies for the "Helm deploy (kind)" job, in their own
# namespace so the chart's default-deny NetworkPolicies do not apply to them.
# PostgreSQL (pgvector), NATS JetStream and a Temporal dev server. Images are loaded
# into kind by infra/helm/ci/kind-smoke.sh (pinned by digest there), so nothing is
# pulled from inside the cluster. The admin password comes from the Secret
# `postgres-admin`, generated by the script; nothing here is a credential.
apiVersion: v1
kind: Namespace
metadata:
  name: anum-deps
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: anum-deps
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          imagePullPolicy: Never
          env:
            - name: POSTGRES_DB
              value: anum
            - name: POSTGRES_USER
              value: anum_admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-admin, key: password }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "anum_admin", "-d", "anum", "-h", "127.0.0.1"]
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: anum-deps
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: anum-deps
spec:
  replicas: 1
  selector:
    matchLabels: { app: nats }
  template:
    metadata:
      labels: { app: nats }
    spec:
      containers:
        - name: nats
          image: nats:2.10-alpine
          imagePullPolicy: Never
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - containerPort: 4222
            - containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: 8222
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: anum-deps
spec:
  selector: { app: nats }
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: anum-deps
spec:
  replicas: 1
  selector:
    matchLabels: { app: temporal }
  template:
    metadata:
      labels: { app: temporal }
    spec:
      containers:
        - name: temporal
          image: temporalio/temporal:1.9.1
          imagePullPolicy: Never
          args: ["server", "start-dev", "--ip", "0.0.0.0", "--headless"]
          ports:
            - containerPort: 7233
          readinessProbe:
            tcpSocket:
              port: 7233
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: temporal
  namespace: anum-deps
spec:
  selector: { app: temporal }
  ports:
    - port: 7233
      targetPort: 7233
