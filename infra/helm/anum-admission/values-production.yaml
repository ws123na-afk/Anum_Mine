# Production cluster: helm upgrade --install anum-admission infra/helm/anum-admission \
#   -f infra/helm/anum-admission/values-production.yaml --set github.repository=<owner>/<repo>
# then: kubectl label namespace anum policy.sigstore.dev/include=true
# Production promotes the API and backup digests deploy-staging.yml signed, and runs a
# web image deploy-production.yml built, signed and attested for production's URLs.
# If staging and production share one cluster, the policies are cluster-wide: list
# both workflows as web signers there. Placeholders only.

mode: enforce

images:
  api:
    repository: ghcr.io/owner/anum-api
    signers: [deploy-staging.yml]
  web:
    repository: ghcr.io/owner/anum-web
    signers: [deploy-production.yml]
  backup:
    repository: ghcr.io/owner/anum-backup
    signers: [deploy-staging.yml]
