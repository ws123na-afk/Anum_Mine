{{- if .Values.web.enabled }}
{{- $component := "web" }}
{{- $v := .Values.web }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anum.fullname" . }}-web
  labels:
    {{- include "anum.labels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "anum.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "anum.labels" (dict "root" $ "component" $component) | nindent 8 }}
      {{- with $v.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "anum.serviceAccountName" (dict "root" $ "component" $component) }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        runAsUser: {{ $v.uid }}
        runAsGroup: {{ $v.uid }}
        fsGroup: {{ $v.uid }}
      containers:
        - name: web
          image: {{ include "anum.image" (dict "image" .Values.image.web "root" $) }}
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Substituted into the Content-Security-Policy connect-src at start.
            - name: ANUM_CSP_CONNECT_SRC
              value: {{ $v.cspConnectSrc | quote }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          volumeMounts:
            # The image renders /etc/nginx/templates into conf.d at start and keeps its
            # pid file and temp paths under /tmp; both stay writable, nothing else.
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-conf
          emptyDir:
            sizeLimit: 1Mi
      affinity:
        {{- include "anum.affinity" (dict "root" $ "component" $component "affinity" $v.affinity) | nindent 8 }}
      {{- with $v.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $v.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "anum.fullname" . }}-web
  labels:
    {{- include "anum.labels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  type: {{ $v.service.type }}
  selector:
    {{- include "anum.selectorLabels" (dict "root" $ "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ $v.service.port }}
      targetPort: http
      protocol: TCP
{{- if $v.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "anum.fullname" . }}-web
  labels:
    {{- include "anum.labels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  minAvailable: {{ $v.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "anum.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
{{- end }}
{{- end }}
