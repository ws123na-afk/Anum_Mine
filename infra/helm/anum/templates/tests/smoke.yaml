{{- if .Values.tests.enabled }}
{{- $component := "test" }}
{{- $fullname := include "anum.fullname" . }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ $fullname }}-smoke
  labels:
    {{- include "anum.labels" (dict "root" $ "component" $component) | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
    runAsUser: {{ .Values.api.uid }}
    runAsGroup: {{ .Values.api.uid }}
  containers:
    - name: smoke
      # The API image has Python; nothing else is pulled for the test.
      image: {{ include "anum.image" (dict "image" .Values.image.api "root" $) }}
      imagePullPolicy: {{ .Values.image.api.pullPolicy }}
      env:
        - name: API_URL
          value: "http://{{ $fullname }}-api:{{ .Values.api.service.port }}"
        - name: WEB_URL
          value: {{ if .Values.web.enabled }}"http://{{ $fullname }}-web:{{ .Values.web.service.port }}"{{ else }}""{{ end }}
        - name: EXPECTED_ENVIRONMENT
          value: {{ .Values.config.ANUM_ENVIRONMENT | quote }}
      command:
        - python
        - -c
        - |
          import json, os, sys, urllib.error, urllib.request

          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=10) as response:
                      return response.status, response.headers, response.read()
              except urllib.error.HTTPError as error:
                  return error.code, error.headers, error.read()

          api, web = os.environ["API_URL"], os.environ["WEB_URL"]
          status, headers, body = get(api + "/health")
          health = json.loads(body)
          assert status == 200 and health["status"] == "ok", (status, body)
          assert health["environment"] == os.environ["EXPECTED_ENVIRONMENT"], health
          assert headers.get("content-security-policy"), "API response has no CSP header"
          print("api /health ok:", health)
          # OIDC mode: a request without a bearer token is refused.
          status, _, body = get(api + "/api/v1/tasks")
          assert status == 401, (status, body[:200])
          print("api refuses unauthenticated requests: 401")
          # Interactive docs are local-only.
          status, _, _ = get(api + "/docs")
          assert status == 404, status
          print("api /docs disabled: 404")
          if web:
              status, headers, body = get(web + "/healthz")
              assert status == 200, (status, body[:200])
              status, headers, _ = get(web + "/")
              assert status == 200 and headers.get("content-security-policy"), status
              print("web /healthz and CSP ok")
          print("smoke test passed")
      securityContext:
        {{- toYaml .Values.containerSecurityContext | nindent 8 }}
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 256Mi
{{- end }}
