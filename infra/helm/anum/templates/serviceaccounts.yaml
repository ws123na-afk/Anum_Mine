{{- /*
One ServiceAccount per workload. None of the workloads talks to the Kubernetes API,
so no token is mounted (also set on every pod spec). Annotations let a cloud bind a
workload identity (IRSA, GKE/AKS workload identity) for object storage access.
The migration ServiceAccount is a hook resource: it must exist before the
pre-install migration Job, which runs before regular release resources.
*/ -}}
{{- $components := list -}}
{{- if .Values.api.enabled }}{{ $components = append $components "api" }}{{ end -}}
{{- if .Values.worker.enabled }}{{ $components = append $components "worker" }}{{ end -}}
{{- if .Values.web.enabled }}{{ $components = append $components "web" }}{{ end -}}
{{- if .Values.voiceRetention.enabled }}{{ $components = append $components "voice-retention" }}{{ end -}}
{{- if .Values.backup.enabled }}{{ $components = append $components "backup" }}{{ end -}}
{{- range $components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "anum.serviceAccountName" (dict "root" $ "component" .) }}
  labels:
    {{- include "anum.labels" (dict "root" $ "component" .) | nindent 4 }}
  {{- with $.Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.migration.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "anum.serviceAccountName" (dict "root" $ "component" "migrate") }}
  labels:
    {{- include "anum.labels" (dict "root" $ "component" "migrate") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- with $.Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
