# CI only: values for the "Helm deploy (kind)" job (infra/helm/ci/kind-smoke.sh).
# A staging-shaped release (OIDC, PostgreSQL with RLS logins, NATS, Temporal) against
# throwaway dependencies in the anum-deps namespace (infra/helm/ci/deps.yaml).
# Hosts are .example placeholders that are never contacted: /health and the 401 check
# need no Keycloak. Every credential is generated by the script at run time.

image:
  api:
    repository: anum-api
    tag: ci
    pullPolicy: Never
  web:
    repository: anum-web
    tag: ci
    pullPolicy: Never

config:
  ANUM_ENVIRONMENT: staging
  ANUM_KEYCLOAK_ISSUER: https://id.anum-ci.example/realms/anum
  ANUM_CORS_ORIGINS: '["https://app.anum-ci.example"]'
  ANUM_NATS_URL: nats://nats.anum-deps.svc.cluster.local:4222
  ANUM_TEMPORAL_TARGET: temporal.anum-deps.svc.cluster.local:7233
  # No Valkey in the kind cluster: per-process limits and database row locks only.
  ANUM_RUN_LOCK_BACKEND: none
  ANUM_RATE_LIMIT_BACKEND: memory
  # One API replica with local file storage (the chart refuses this with more).
  ANUM_OBJECT_STORAGE_BACKEND: local
  ANUM_MODEL_PROVIDER: mock

api:
  replicas: 1
  hpa:
    enabled: false
  pdb:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

worker:
  replicas: 1
  pdb:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi

web:
  replicas: 1
  pdb:
    enabled: false
  cspConnectSrc: "https://api.anum-ci.example https://id.anum-ci.example"

ingress:
  # The ingress object is rendered and validated; kind has no controller, so the
  # smoke test goes through port-forward and `helm test`.
  enabled: true
  hosts:
    web: app.anum-ci.example
    api: api.anum-ci.example
  tls:
    enabled: false

backup:
  enabled: true
  image:
    repository: anum-backup
    tag: ci
    pullPolicy: Never
  persistentVolumeClaim: anum-backups
