# Minimal SPA server block for the ANUM web app's static build output.
# Copied into /etc/nginx/conf.d/default.conf by apps/web/Dockerfile.

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # gzip text assets (JS/CSS/HTML/JSON/SVG) served by this app.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Vite emits content-hashed filenames under /assets (e.g.
    # assets/index-Dx16xySA.js), so these are safe to cache aggressively and
    # immutably - a new deploy ships new filenames, never new content at the
    # same URL.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # There is no client-side router in the app today, but SPA fallback is
    # the standard safe default so deep-linking keeps working if one gets
    # added later. index.html itself must not be cached so new deploys are
    # picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
