<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0d12" />
    <title>ANUM</title>
    <!-- The page colour before the stylesheet arrives, so loading never flashes white (docs/design/anum360.md#theme). -->
    <style>html{background:#0b0d12;color-scheme:dark}html[data-theme="light"]{background:#f7f8fa;color-scheme:light}</style>
    <script src="/theme-init.js"></script>
    <!-- Self-hosted Inter and Noto Sans Arabic (public/fonts); only the Latin face is preloaded. -->
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
