[package]
name = "anum-desktop"
version = "0.1.0"
description = "ANUM desktop client"
authors = ["ANUM"]
edition = "2021"

[lib]
name = "anum_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# Exact pin: 2.13 needs tauri 2.12. Registered only when the build carries an updater config.
# No `zip` feature: our updater artifacts are raw installers (NSIS, MSI, AppImage, deb, rpm) and
# the macOS .app.tar.gz, never zipped v1 bundles, and the zip crate it pulls in has open
# advisories (RUSTSEC-2026-0367/0368/0369, fixed only in zip 9, which no updater release uses).
tauri-plugin-updater = { version = "=2.12.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
