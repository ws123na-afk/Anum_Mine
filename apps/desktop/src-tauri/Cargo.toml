[package]
name = "anum-desktop"
version = "0.1.0"
description = "ANUM desktop client"
authors = ["ANUM"]
edition = "2021"

[lib]
name = "anum_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# Exact pin: 2.13 needs tauri 2.12. Registered only when the build carries an updater config.
# Default features minus "zip": that feature only unpacks Tauri v1 ".msi.zip" / ".AppImage.tar.gz"
# update bundles, and it pulls in zip 4.x (RUSTSEC-2026-0367, -0368, -0369; no fixed 4.x, and no
# updater release accepts zip 9). The release sets createUpdaterArtifacts: true (v2 artifacts:
# signed .msi/.exe, raw AppImage); macOS .app.tar.gz extraction does not depend on the feature.
tauri-plugin-updater = { version = "=2.12.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
