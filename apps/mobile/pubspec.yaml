name: anum_mobile
description: Governed ANUM agent workbench for Android, iOS, and tablets.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  http: ^1.3.0
  flutter_secure_storage: ^11.2.0
  # Held at 10.x: 11 relies on AGP 9 built-in Kotlin, which this app turns off
  # (android.builtInKotlin=false) while flutter_tts still applies the Kotlin plugin.
  # See docs/mobile.md, Dependencies.
  file_picker: 13.1.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  permission_handler: ^13.0.1
  flutter_appauth: 12.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
