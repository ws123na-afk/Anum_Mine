name: anum_mobile
description: Governed ANUM agent workbench for Android, iOS, and tablets.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  http: ^1.3.0
  flutter_secure_storage: ^11.2.0
  # Held at 10.x: 11 relies on AGP 9 built-in Kotlin, which this app turns off
  # (android.builtInKotlin=false) while flutter_tts still applies the Kotlin plugin.
  # See docs/mobile.md, Dependencies.
  file_picker: 13.1.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  permission_handler: ^13.0.1
  flutter_appauth: 12.1.0
  # Opens pull request and run links in the browser (Developer screen).
  # url_launcher_android is held at 6.3.29, the last Java release: 6.3.30+
  # rely on AGP 9 built-in Kotlin like file_picker 11 (see above).
  url_launcher: ^6.3.2
  url_launcher_android: 6.3.33
  # Phone push (docs/notifications.md, docs/mobile.md#phone-push). Checked for
  # AGP 9 built-in Kotlin: firebase_messaging 16.7 is Java only and
  # firebase_core 4.15 applies kotlin-android itself when
  # android.builtInKotlin=false, so neither needs a pin. The app builds and
  # runs without the owner's Firebase files; push then stays off.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
