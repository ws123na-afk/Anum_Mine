name: anum_mobile
description: Governed ANUM agent workbench for Android, iOS, and tablets.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  http: ^1.3.0
  flutter_secure_storage: ^9.2.4
  file_picker: ^8.3.7
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  permission_handler: ^13.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
