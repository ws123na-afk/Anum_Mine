name: anum_mobile
description: Governed ANUM agent workbench for Android, iOS, and tablets.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  http: ^1.3.0
  flutter_secure_storage: ^10.3.4
  # Held at 10.x: 11 relies on AGP 9 built-in Kotlin, which this app turns off
  # (android.builtInKotlin=false) while flutter_tts still applies the Kotlin plugin.
  # See docs/mobile.md, Dependencies.
  file_picker: 10.3.10
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  permission_handler: ^13.0.1
  flutter_appauth: 12.1.0
  # Opens pull request and run links in the browser (Developer screen).
  # url_launcher_android is held at 6.3.29, the last Java release: 6.3.30+
  # rely on AGP 9 built-in Kotlin like file_picker 11 (see above).
  url_launcher: ^6.3.2
  url_launcher_android: 6.3.29
  # Phone push (docs/notifications.md, docs/mobile.md#phone-push). Checked for
  # AGP 9 built-in Kotlin: firebase_messaging 16.7 is Java only and
  # firebase_core 4.15 applies kotlin-android itself when
  # android.builtInKotlin=false, so neither needs a pin. The app builds and
  # runs without the owner's Firebase files; push then stays off.
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  # In-app calls between teammates (docs/in-app-calls.md#flutter). Pinned: its
  # Android plugin is Java plus one Kotlin file and applies kotlin-android itself
  # while android.builtInKotlin=false (checked in its android/build.gradle, the
  # AGP 9 note in CLAUDE.md); a major bump needs that check again.
  flutter_webrtc: 1.6.2+hotfix.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Journey tests in integration_test/ (docs/mobile-journeys.md), run headless
  # with `flutter test integration_test -d flutter-tester`.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  # Bundled type (owner decision 12 Oct 2026, docs/mobile.md#fonts): Inter cut to
  # Latin and Noto Sans Arabic, static instances per weight from the variable
  # Google Fonts sources, SIL Open Font License (licences registered at start-up
  # from assets/fonts/OFL-*.txt). Weights the app uses: 400 to 800 (900 falls
  # back to 800).
  assets:
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-NotoSansArabic.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
        - asset: assets/fonts/Inter-800.ttf
          weight: 800
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-400.ttf
          weight: 400
        - asset: assets/fonts/NotoSansArabic-500.ttf
          weight: 500
        - asset: assets/fonts/NotoSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/NotoSansArabic-700.ttf
          weight: 700
        - asset: assets/fonts/NotoSansArabic-800.ttf
          weight: 800
