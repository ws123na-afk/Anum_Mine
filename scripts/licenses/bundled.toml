# Compiled third-party libraries that a package carries inside it (docs/licenses.md).
#
# The scan reads one license per package from its metadata. Binary wheels (and other
# prebuilt packages) can also contain shared libraries built from other projects, each under
# its own license; those are listed here after a person opened the package and read its
# license files. license_scan.py prints them in THIRD_PARTY_NOTICES.md under "Native
# libraries bundled inside packages".
#
# `versions` is exact (or a "X.Y.*" prefix): a new version of the package makes the entry
# stale and fails the scan, so the libraries it bundles are reviewed again. Never edit the
# license texts in licenses/third-party/: they are copied verbatim.
#
#   [[bundled]]
#   ecosystem = "python"
#   package = "example"
#   versions = ["1.2.3"]
#   reviewed_on = "2026-11-04"
#   note = "What was opened, for which platforms."
#   license_texts = ["licenses/third-party/example-1.2.3-LICENSE.txt"]
#   [[bundled.libraries]]
#   name = "zlib"
#   license = "Zlib"                      # SPDX expression as the library's license file states it
#   copyright = "Jean-loup Gailly and Mark Adler"
#   source = "https://zlib.net"
#   notice = "..."                        # optional: credit or notice the license asks for

