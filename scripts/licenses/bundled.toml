[[bundled]]
ecosystem = "python"
package = "playwright"
versions = ["1.64.1"]
reviewed_on = "2026-11-10"
note = "Browser image only (services/api/Dockerfile with ANUM_BROWSER=1). Read from the 1.64.1 manylinux1 x86_64 wheel: `playwright/driver/` holds a Node.js binary and the playwright-core npm package (driver build 1.64.0-beta-1791568591000), each with its own license files, copied verbatim. playwright-core now inlines its npm dependencies into `lib/utilsBundle.js` and `lib/serverRegistry.js` and ships a WebP codec (`lib/webp_codec.wasm`); each has a sidecar license file listing every inlined package with its full license text (all MIT, ISC or BSD-3-Clause), copied verbatim too. At image build time `playwright install --with-deps --only-shell chromium` also downloads the Chromium headless shell (revision 1248, Chromium 156.0.8078.4) into /opt/ms-playwright and installs its Debian runtime packages; those Debian packages are in the image's Trivy SBOM. Chromium's own third-party components are NOT enumerated here: the download could not be fetched for review (its host is blocked from the review machine), so the Chromium row points at Chromium's license and credits instead."
license_texts = [
  "licenses/third-party/playwright-1.64.1/nodejs-24.22.1-LICENSE.txt",
  "licenses/third-party/playwright-1.64.1/playwright-core-1.64.0-LICENSE.txt",
  "licenses/third-party/playwright-1.64.1/playwright-core-1.64.0-NOTICE.txt",
  "licenses/third-party/playwright-1.64.1/playwright-core-1.64.0-ThirdPartyNotices.txt",
  "licenses/third-party/playwright-1.64.1/playwright-core-1.64.0-utilsBundle.js.LICENSE.txt",
  "licenses/third-party/playwright-1.64.1/playwright-core-1.64.0-serverRegistry.js.LICENSE.txt",
  "licenses/third-party/playwright-1.64.1/playwright-core-1.64.0-webp_codec.LICENSE.txt",
  "licenses/third-party/BSD-3-Clause.txt",
]

