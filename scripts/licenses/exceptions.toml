# Reviewed license decisions for scripts/licenses/license_scan.py (docs/licenses.md).
#
# Two kinds of entry. Both are matched exactly, so an entry goes stale (and fails the scan)
# when the package's metadata changes or the package is no longer shipped: review it again.
#
# [[override]] corrects a license the scan detected wrongly or could not detect, after a
# person read the package's actual license. It never accepts a license the policy fails;
# the corrected license is still checked against scripts/licenses/policy.toml.
#
#   [[override]]
#   ecosystem = "python"            # python, npm, cargo, dart or gradle
#   package = "example-package"     # as the scan reports it (Maven: "group:artifact")
#   detected = ""                   # what the scan detected ("" when nothing was found)
#   license = "BSD-3-Clause"        # SPDX expression of the real license
#   evidence = "https://..."        # where the license text was read, at a fixed revision
#   reason = "Metadata names only 'BSD License'; LICENSE at the tag is BSD-3-Clause."
#
# [[exception]] accepts a package whose license the policy puts in "review" or "denied", or
# leaves unknown. Only the owner adds these, with the reason the obligations are met.
#
#   [[exception]]
#   ecosystem = "python"
#   package = "example-package"
#   versions = ["1.2.3"]            # approved versions: exact, or a "1.2.*" prefix; another
#                                   # version is a violation again until reviewed
#   license = "LGPL-3.0-only"       # must equal the license the scan reports for it
#   reason = "Imported unmodified as a separate library; users can replace it; notice shipped."
#   reviewed_by = "owner name"
#   reviewed_on = "2026-10-18"
#   source_url = "https://..."      # optional: where the source is offered (shown in the notices)
#   notice = "Licensed under ..."   # optional: notice text the license asks for (shown in the notices)
#   shipped = false                 # optional: in a lockfile closure but proven never to ship

[[override]]
ecosystem = "python"
package = "python-dateutil"
detected = ""
license = "Apache-2.0 AND BSD-3-Clause"
evidence = "https://github.com/dateutil/dateutil/blob/2.9.0.post0/LICENSE"
reason = "Metadata says only 'Dual License'. LICENSE at the tag: Apache-2.0 for contributions after 2017-12-01, and the BSD-3-Clause text applies to all code."

[[override]]
ecosystem = "python"
package = "defusedxml"
detected = "PSFL"
license = "PSF-2.0"
evidence = "https://github.com/tiran/defusedxml/blob/v0.7.1/LICENSE"
reason = "Metadata says 'PSFL' with the classifier 'Python Software Foundation License'; the LICENSE in the 0.7.1 wheel is the Python Software Foundation License Version 2."

# Owner decision, 4 November 2026: psycopg is approved for its installed version and license.
[[exception]]
ecosystem = "python"
package = "psycopg"
versions = ["3.3.6"]
license = "LGPL-3.0-only"
reason = "PostgreSQL driver, used unmodified as a separate Python package that loads at run time and can be replaced; ANUM's code is not linked into it. Its LICENSE ships inside the package and in licenses/third-party/."
reviewed_by = "owner"
reviewed_on = "2026-11-04"
source_url = "https://github.com/psycopg/psycopg/tree/3.3.6"
notice = "psycopg is licensed under the GNU Lesser General Public License version 3 (licenses/third-party/psycopg-3.3.6-LICENSE.txt with licenses/third-party/GPL-3.0-only.txt). Its source is at the URL above."

[[exception]]
ecosystem = "python"
package = "psycopg-binary"
versions = ["3.3.6"]
license = "LGPL-3.0-only"
reason = "Prebuilt C extension of psycopg, used unmodified as a separate shared library that can be replaced (for example by building psycopg[c]). It bundles libpq, OpenSSL and other native libraries, listed with their licenses and notices in scripts/licenses/bundled.toml."
reviewed_by = "owner"
reviewed_on = "2026-11-04"
source_url = "https://github.com/psycopg/psycopg/tree/3.3.6/psycopg_c"
notice = "psycopg-binary is licensed under the GNU Lesser General Public License version 3 (licenses/third-party/psycopg-3.3.6-LICENSE.txt with licenses/third-party/GPL-3.0-only.txt). Its source is at the URL above; the libraries it bundles are listed under Native libraries bundled inside packages."

# Owner decision, 4 November 2026: sharp and libvips are approved as build-time only (not shipped).

[[exception]]
ecosystem = "npm"
package = "@img/sharp-libvips-darwin-arm64"
versions = ["1.3.4"]
license = "LGPL-3.0-or-later"
reason = "Build-time only: in the web and desktop lockfile closure through kokoro-js and @huggingface/transformers, but Node-only and never shipped. A production build of apps/web/dist has no sharp or libvips file or module reference, the Tauri bundle ships only that dist and the Rust binary, the web image copies only that dist, and the API and worker images contain no npm packages. scripts/licenses/assert_not_bundled.py fails the web and desktop CI jobs if that ever changes."
reviewed_by = "owner"
reviewed_on = "2026-11-04"
shipped = false

