name: Deploy production

# Promotes a commit that staging already built and deployed to production with the Helm
# chart in infra/helm/anum, or rolls production back to an earlier Helm revision
# (docs/deployment.md#rollback). Manual only. Every job that touches production runs in
# the `production` GitHub environment, whose required reviewers approve the run.
# Skipped while the `PRODUCTION_DEPLOY_TARGET` repository variable is unset.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Full commit SHA on main whose images deploy-staging.yml pushed"
        required: true
        type: string
      rollback_to_revision:
        description: "Instead of deploying: Helm revision to roll back to (see `helm history anum`)"
        required: false
        type: string
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE: anum
  # Same pinned Helm as the CI "Helm deploy (kind)" job.
  HELM_VERSION: v4.3.0

jobs:
  web-image:
    name: Build production web image
    # The API URL and Keycloak issuer are compiled into the bundle, so production gets
    # its own web image built from the same commit. The API image is promoted as is.
    if: ${{ vars.PRODUCTION_DEPLOY_TARGET != '' && inputs.rollback_to_revision == '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      web_image: ${{ steps.names.outputs.web_image }}
    steps:
      - name: Check the commit input
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit must be a full 40-character SHA"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - name: Image name
        id: names
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "web_image=ghcr.io/${owner}/anum-web:${COMMIT}-production" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push web image
        env:
          IMAGE: ${{ steps.names.outputs.web_image }}
          COMMIT: ${{ inputs.commit }}
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          PRODUCTION_OIDC_ISSUER: ${{ vars.PRODUCTION_OIDC_ISSUER }}
        run: |
          if [ -z "$PRODUCTION_API_URL" ] || [ -z "$PRODUCTION_OIDC_ISSUER" ]; then
            echo "::error::Set PRODUCTION_API_URL and PRODUCTION_OIDC_ISSUER: the bundle must not fall back to local sessions."
            exit 1
          fi
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${COMMIT}" \
            --build-arg "VITE_ANUM_API_URL=${PRODUCTION_API_URL}" \
            --build-arg "VITE_ANUM_OIDC_ISSUER=${PRODUCTION_OIDC_ISSUER}" \
            -f apps/web/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "- \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to production
    needs: web-image
    if: ${{ vars.PRODUCTION_DEPLOY_TARGET != '' && inputs.rollback_to_revision == '' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_WEB_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_TARGET: ${{ vars.PRODUCTION_DEPLOY_TARGET }}
      COMMIT: ${{ inputs.commit }}
      WEB_IMAGE: ${{ needs.web-image.outputs.web_image }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
      NAMESPACE: ${{ vars.PRODUCTION_NAMESPACE || 'anum' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - name: Check deploy target
        run: |
          case "$DEPLOY_TARGET" in
            kubernetes) ;;
            *)
              echo "::error::PRODUCTION_DEPLOY_TARGET='${DEPLOY_TARGET}' is not supported. Set it to 'kubernetes' (docs/deployment.md)."
              exit 1
              ;;
          esac
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: false
      - name: Install Helm
        run: |
          go install "helm.sh/helm/v4/cmd/helm@${HELM_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # Kubeconfig for a namespace-scoped deploy identity in the `production` environment
      # secret PRODUCTION_KUBECONFIG, or replace this step with the cloud's OIDC login.
      - name: Configure cluster access
        env:
          KUBECONFIG_DATA: ${{ secrets.PRODUCTION_KUBECONFIG }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "::error::Set the production environment secret PRODUCTION_KUBECONFIG, or replace this step with the cloud's OIDC login (docs/deployment.md#cluster-access)."
            exit 1
          fi
          umask 077
          printf '%s\n' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      - name: Environment values
        env:
          EXTRA_VALUES: ${{ vars.PRODUCTION_HELM_VALUES }}
        run: |
          if [ -n "$EXTRA_VALUES" ]; then
            printf '%s\n' "$EXTRA_VALUES" > "$RUNNER_TEMP/values-extra.yaml"
          else
            echo '{}' > "$RUNNER_TEMP/values-extra.yaml"
          fi
      - name: Record the revision to roll back to
        run: |
          echo "### Before this deploy" >> "$GITHUB_STEP_SUMMARY"
          helm history "$RELEASE" --namespace "$NAMESPACE" --max 5 >> "$GITHUB_STEP_SUMMARY" 2>&1 || echo "(first install)" >> "$GITHUB_STEP_SUMMARY"
      - name: Helm upgrade --install (migrations run first as a hook)
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          helm upgrade --install "$RELEASE" infra/helm/anum \
            --namespace "$NAMESPACE" \
            -f infra/helm/anum/values-production.yaml \
            -f "$RUNNER_TEMP/values-extra.yaml" \
            --set "image.api.repository=ghcr.io/${owner}/anum-api" --set-string "image.api.tag=${COMMIT}" \
            --set "image.web.repository=${WEB_IMAGE%:*}" --set-string "image.web.tag=${WEB_IMAGE##*:}" \
            --set "backup.image.repository=ghcr.io/${owner}/anum-backup" --set-string "backup.image.tag=${COMMIT}" \
            --wait --timeout 20m --rollback-on-failure --history-max 30
      - name: Helm test
        run: helm test "$RELEASE" --namespace "$NAMESPACE" --logs --timeout 5m
      - name: Smoke test production API
        if: ${{ vars.PRODUCTION_API_URL != '' }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "${PRODUCTION_API_URL%/}/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production API did not become healthy; roll back with rollback_to_revision (docs/deployment.md#rollback)"
          exit 1
      - name: Release history
        if: always()
        run: |
          if [ -n "${KUBECONFIG:-}" ]; then
            helm history "$RELEASE" --namespace "$NAMESPACE" --max 10 || true
          fi

  rollback:
    name: Roll production back
    if: ${{ vars.PRODUCTION_DEPLOY_TARGET != '' && inputs.rollback_to_revision != '' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_WEB_URL }}
    permissions:
      contents: read
      id-token: write
    env:
      REVISION: ${{ inputs.rollback_to_revision }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
      NAMESPACE: ${{ vars.PRODUCTION_NAMESPACE || 'anum' }}
    steps:
      - name: Check the revision input
        run: |
          if ! [[ "$REVISION" =~ ^[0-9]+$ ]]; then
            echo "::error::rollback_to_revision must be a Helm revision number"
            exit 1
          fi
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: false
      - name: Install Helm
        run: |
          go install "helm.sh/helm/v4/cmd/helm@${HELM_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Configure cluster access
        env:
          KUBECONFIG_DATA: ${{ secrets.PRODUCTION_KUBECONFIG }}
        run: |
          if [ -z "$KUBECONFIG_DATA" ]; then
            echo "::error::Set the production environment secret PRODUCTION_KUBECONFIG, or replace this step with the cloud's OIDC login (docs/deployment.md#cluster-access)."
            exit 1
          fi
          umask 077
          printf '%s\n' "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
      # Rolls back the application only: database migrations are forward-only and stay
      # applied (docs/deployment.md#rollback).
      - name: Helm rollback
        run: |
          helm history "$RELEASE" --namespace "$NAMESPACE" --max 10
          helm rollback "$RELEASE" "$REVISION" --namespace "$NAMESPACE" --wait --timeout 15m
          helm history "$RELEASE" --namespace "$NAMESPACE" --max 5
      - name: Helm test
        run: helm test "$RELEASE" --namespace "$NAMESPACE" --logs --timeout 5m
      - name: Smoke test production API
        if: ${{ vars.PRODUCTION_API_URL != '' }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "${PRODUCTION_API_URL%/}/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production API did not become healthy after the rollback"
          exit 1
