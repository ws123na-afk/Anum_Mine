name: Live model

# A small smoke test of the native `anthropic` provider against the real Messages API
# (docs/model-gateway.md#live-provider-smoke-test): one non-streaming call, one streamed
# chat, two cached planning calls and one structured call on claude-haiku-5-5 with a
# tiny output cap. It checks usage and cost accounting, that a cache breakpoint is
# sent and, when the API reports caching, that a repeat reads the cached prefix.
#
# Cost: well under US$0.01 per run (about 15k input tokens, mostly the cached planning
# prefix, and a few hundred output tokens at $0.10/$0.50 per million). Weekly plus the
# occasional manual or labelled run stays far below US$0.10 a month.
#
# Runs on demand, weekly, and on a pull request only while it carries the `live-model`
# label and comes from this repository (never a fork). It reads the repository secret
# ANTHROPIC_API_KEY; without it the job ends with a notice and succeeds, so CI never
# depends on a secret contributors do not have.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]

permissions: {}

concurrency:
  group: live-model-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Live Anthropic smoke test
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'live-model') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check for the ANTHROPIC_API_KEY secret
        id: key
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Live model test not run::The repository secret ANTHROPIC_API_KEY is not set. An owner can add it under Settings > Secrets and variables > Actions to run the live provider smoke test."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install the API
        if: steps.key.outputs.present == 'true'
        run: |
          python -m pip install --disable-pip-version-check "pip==24.3.1"
          python -m pip install --disable-pip-version-check -e "services/api[test]"
      - name: Run the live_model tests
        if: steps.key.outputs.present == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pytest services/api -m live_model -rs -q
