name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  web:
    name: Web and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.12.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm docs:check
      - run: pnpm check
      - run: pnpm build

  api-unit:
    name: API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install --disable-pip-version-check "pip==24.3.1"
      - run: python -m pip install --disable-pip-version-check -e "services/api[test]"
      - run: python -m pytest services/api -m "not database"

  browser-e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.12.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @anum/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  api-persistence:
    name: API PostgreSQL persistence tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: anum
          POSTGRES_PASSWORD: anum
          POSTGRES_DB: anum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anum -d anum_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ANUM_TEST_DATABASE_URL: postgresql+psycopg://anum:anum@localhost:5432/anum_test
      ANUM_DATABASE_URL: postgresql+psycopg://anum:anum@localhost:5432/anum_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install --disable-pip-version-check "pip==24.3.1"
      - run: python -m pip install --disable-pip-version-check -e "services/api[test]"
      - name: Apply database migrations
        working-directory: services/api
        run: python -m alembic upgrade head
      - name: Run database tests
        run: python -m pytest services/api -m database

  integration:
    name: API integration (Valkey, S3, Temporal, NATS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install --disable-pip-version-check "pip==24.3.1"
      - run: python -m pip install --disable-pip-version-check -e "services/api[test]"
      - name: Start Valkey, S3 storage and NATS
        run: |
          docker compose -f infra/docker/compose.yaml up -d valkey s3 nats
          for attempt in $(seq 1 60); do
            if docker compose -f infra/docker/compose.yaml exec -T valkey valkey-cli ping | grep -q PONG \
              && curl -fsS http://127.0.0.1:9000/healthz \
              && curl -fsS "http://127.0.0.1:8222/healthz?js-enabled-only=true"; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Valkey, S3 storage or NATS did not become ready"
          exit 1
      - name: Run integration-marked tests (none may be skipped)
        working-directory: services/api
        env:
          ANUM_TEST_VALKEY_URL: redis://127.0.0.1:6379/15
          ANUM_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          ANUM_TEST_NATS_URL: nats://127.0.0.1:4222
          # Temporal tests start a real dev server through the SDK (downloaded on first use).
        run: |
          set -o pipefail
          python -m pytest -m "(valkey or s3 or temporal or nats) and not database" -rs | tee integration.log
          if grep -q "SKIPPED" integration.log; then
            echo "::error::Integration tests were skipped; every adapter must be exercised in CI"
            exit 1
          fi
      - name: Service logs
        if: failure()
        run: docker compose -f infra/docker/compose.yaml logs --no-color

  journey:
    name: Authenticated journey
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOURNEY_API_LOG: ${{ github.workspace }}/anum-journey-api.log
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install --disable-pip-version-check "pip==24.3.1"
      - run: python -m pip install --disable-pip-version-check -e "services/api[test]"
      - name: Sign in through Keycloak, run and approve a task, verify SSE, NATS and PostgreSQL
        # Starts postgres, nats and keycloak from infra/docker/compose.yaml, migrates,
        # runs the API with ANUM_AUTH_MODE=oidc, ANUM_REPOSITORY_BACKEND=postgresql and
        # ANUM_EVENT_BUS=nats as a non-superuser role, then runs scripts/journey.py.
        run: bash services/api/scripts/run_journey.sh
      - name: Service logs
        if: failure()
        run: |
          docker compose -f infra/docker/compose.yaml ps || true
          docker compose -f infra/docker/compose.yaml logs --no-color --tail 200 postgres nats keycloak || true
          cat "$JOURNEY_API_LOG" || true

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f infra/docker/compose.yaml config
      - run: docker compose -f infra/docker/compose.yaml --profile app config

  security:
    name: Security scans
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      # Built from source: the Go module proxy and checksum database verify the module.
      OSV_SCANNER_VERSION: v2.6.0
      # Installed with --locked, so crates.io checksums in its Cargo.lock are enforced.
      CARGO_AUDIT_VERSION: 0.22.2
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.12.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Python scanners
        run: python -m pip install --disable-pip-version-check "pip-audit==2.10.1" "bandit==1.9.4"
      - name: Python dependency audit (pip-audit)
        run: pip-audit --strict services/api
      - name: Node production dependency audit (pnpm audit)
        # High and critical advisories fail the job. docs/security.md lists the one
        # moderate advisory that has no patched release.
        run: pnpm audit --prod --audit-level high
      - name: Python SAST (bandit)
        run: bandit -r services/api/anum_api services/api/migrations
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          # Whole history of the commit under test; --log-opts keeps other branches out.
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --log-opts="HEAD" --redact --no-banner --exit-code 1 .
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: false
      - name: Install OSV-Scanner
        run: go install "github.com/google/osv-scanner/v2/cmd/osv-scanner@${OSV_SCANNER_VERSION}"
      - name: Dependency vulnerability scan (OSV-Scanner)
        # Every severity fails the job; reviewed exceptions live in osv-scanner.toml
        # and docs/security.md. The API has no lockfile, so the exact set pip resolves
        # for services/api is written out and scanned without re-resolution.
        run: |
          python -m pip install --disable-pip-version-check --quiet --dry-run --ignore-installed \
            --report "$RUNNER_TEMP/api-report.json" ./services/api
          jq -r '.install[] | select(.metadata.name != "anum-api") | "\(.metadata.name)==\(.metadata.version)"' \
            "$RUNNER_TEMP/api-report.json" | sort > "$RUNNER_TEMP/api-requirements.txt"
          test -s "$RUNNER_TEMP/api-requirements.txt"
          osv-scanner scan source --config osv-scanner.toml --no-resolve \
            --lockfile pnpm-lock.yaml \
            --lockfile "requirements.txt:$RUNNER_TEMP/api-requirements.txt"
      - name: Rust dependency audit (cargo audit)
        # Fails on RustSec vulnerabilities. Unmaintained and unsound notices for crates
        # Tauri pulls in are printed as warnings; docs/security.md lists them.
        run: |
          cargo install cargo-audit --locked --version "${CARGO_AUDIT_VERSION}"
          cargo audit --file apps/desktop/src-tauri/Cargo.lock

  images:
    name: Docker images
    runs-on: ubuntu-latest
    env:
      # Scanner and Temporal dev server images are pinned by digest (tag kept for reading).
      TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
      TEMPORAL_IMAGE: temporalio/temporal:1.9.1@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -t anum-api:ci services/api
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t anum-web:ci .
      - name: Scan images (Trivy)
        # Fails on high or critical vulnerabilities that have a fixed version, and on
        # secrets baked into a layer. Fix by bumping the base image or upgrading packages
        # in the Dockerfile; unavoidable exceptions go in .trivyignore and docs/security.md.
        run: |
          mkdir -p "$HOME/.cache/trivy"
          # The checkout is mounted as the working directory so a .trivyignore is read.
          for image in anum-api:ci anum-web:ci; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              -v "$PWD:/work:ro" -w /work \
              "$TRIVY_IMAGE" image --scanners vuln,secret --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 --no-progress "$image"
          done
      - name: API image refuses development defaults outside local
        run: |
          # Each startup guard is checked on its own: a missing secrets key, header
          # auth outside local, then the compose development defaults.
          refuses() {
            local expected="$1"; shift
            set +e
            timeout 60 docker run --rm --name api-defaults "$@" anum-api:ci > refused.log 2>&1
            local status=$?
            set -e
            cat refused.log
            if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
              echo "::error::API image did not refuse to start ($expected expected)"
              docker rm -f api-defaults || true
              exit 1
            fi
            grep -q "$expected" refused.log
          }
          key="$(openssl rand -base64 32 | tr '+/' '-_')"
          refuses "ANUM_SECRETS_KEY is required"
          refuses AuthConfigurationError -e ANUM_SECRETS_KEY="$key"
          refuses InsecureConfigurationError -e ANUM_SECRETS_KEY="$key" -e ANUM_AUTH_MODE=oidc
      - name: Worker refuses development defaults and the in-memory repository outside local
        run: |
          # `python -m anum_api.worker` runs the API's startup checks, then refuses the
          # per-process in-memory repository outside local (anum_api/worker.py).
          refuses() {
            local expected="$1"; shift
            set +e
            timeout 60 docker run --rm --name worker-refuses "$@" anum-api:ci python -m anum_api.worker > refused.log 2>&1
            local status=$?
            set -e
            cat refused.log
            if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
              echo "::error::Worker did not refuse to start ($expected expected)"
              docker rm -f worker-refuses || true
              exit 1
            fi
            grep -q "$expected" refused.log
          }
          key="$(openssl rand -base64 32 | tr '+/' '-_')"
          refuses "ANUM_SECRETS_KEY is required"
          refuses AuthConfigurationError -e ANUM_SECRETS_KEY="$key"
          refuses InsecureConfigurationError -e ANUM_SECRETS_KEY="$key" -e ANUM_AUTH_MODE=oidc
          # Otherwise acceptable production settings (placeholders, nothing is contacted).
          refuses "The worker needs ANUM_REPOSITORY_BACKEND=postgresql outside local" \
            -e ANUM_SECRETS_KEY="$key" \
            -e ANUM_AUTH_MODE=oidc \
            -e ANUM_KEYCLOAK_ISSUER=https://id.example.test/realms/anum \
            -e ANUM_DATABASE_URL=postgresql+psycopg://anum_worker:ci-placeholder@db.example.test:5432/anum \
            -e 'ANUM_CORS_ORIGINS=["https://app.example.test"]'
      - name: Worker polls Temporal in local mode and shuts down on SIGTERM
        run: |
          docker network create anum-worker-ci
          # Unreachable Temporal: the worker exits non-zero with a clear connection error.
          set +e
          timeout 60 docker run --rm --network anum-worker-ci -e ANUM_ENVIRONMENT=local \
            -e ANUM_TEMPORAL_TARGET=127.0.0.1:1 anum-api:ci python -m anum_api.worker > worker-noconn.log 2>&1
          status=$?
          set -e
          cat worker-noconn.log
          if [ "$status" -eq 0 ] || [ "$status" -eq 124 ]; then
            echo "::error::Worker did not fail when Temporal was unreachable"
            exit 1
          fi
          grep -q "Failed client connect" worker-noconn.log
          docker run -d --name temporal --network anum-worker-ci "$TEMPORAL_IMAGE" \
            server start-dev --ip 0.0.0.0 --headless
          for attempt in $(seq 1 60); do
            if docker run --rm --network anum-worker-ci "$TEMPORAL_IMAGE" \
              operator cluster health --address temporal:7233 > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker run -d --name worker --network anum-worker-ci -e ANUM_ENVIRONMENT=local \
            -e ANUM_TEMPORAL_TARGET=temporal:7233 anum-api:ci python -m anum_api.worker
          for attempt in $(seq 1 60); do
            if docker logs worker 2>&1 | grep -q "ANUM worker polling anum-agent-runs"; then
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' worker)" != "true" ]; then
              break
            fi
            sleep 1
          done
          if ! docker logs worker 2>&1 | grep -q "ANUM worker polling anum-agent-runs"; then
            echo "::error::Worker did not start polling Temporal"
            exit 1
          fi
          test "$(docker exec worker id -u)" != "0"
          # SIGTERM stops polling and shuts the Temporal worker down. The exit code is
          # printed but not asserted: the process sometimes hangs in interpreter
          # finalization after run_worker returns (docs/production-plan.md, Stage 4).
          docker stop --timeout 20 worker
          echo "worker exit code: $(docker inspect -f '{{.State.ExitCode}}' worker)"
          docker logs worker 2>&1 | grep -q "Shutting down"
          docker logs worker 2>&1 | grep -q "Beginning worker shutdown"
      - name: Smoke test images
        run: |
          docker run -d --name api -e ANUM_ENVIRONMENT=local -p 8000:8000 anum-api:ci
          docker run -d --name web -p 8080:8080 anum-web:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health && curl -fsS http://127.0.0.1:8080/healthz; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          test "$(docker exec api id -u)" != "0"
          test "$(docker exec web id -u)" != "0"
          curl -fsS -D - -o /dev/null http://127.0.0.1:8000/health | grep -i '^content-security-policy:'
          curl -fsS -D - -o /dev/null http://127.0.0.1:8080/ | grep -i '^content-security-policy:'
      - name: Container logs
        if: always()
        run: |
          docker logs api || true
          docker logs web || true
          docker logs worker || true
          docker logs temporal --tail 100 || true

  desktop:
    name: Tauri desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.12.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned by commit, so the toolchain is named here instead of in the ref.
          toolchain: stable
          components: clippy
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build
      - run: pnpm check:desktop
      - name: Rust lint (clippy, warnings are errors)
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build Windows installer
        run: pnpm build:desktop
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: anum-desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: Android client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "8.10.2"
      - run: gradle -p apps/android testDebugUnitTest assembleDebug

  flutter-mobile:
    name: Flutter mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Generate native platform wrappers
        run: flutter create --platforms=android,ios .
      - name: Configure voice permissions
        run: dart run tool/configure_native.dart
      - run: flutter pub get
      - name: Run Flutter analyzer (infos and warnings are errors)
        run: flutter analyze --fatal-infos --fatal-warnings
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: false
      - name: Dart dependency vulnerability scan (OSV-Scanner)
        # Scans the pubspec.lock that `flutter pub get` resolved; same pinned
        # OSV-Scanner and exception file as the Security scans job.
        env:
          OSV_SCANNER_VERSION: v2.6.0
        run: |
          go install "github.com/google/osv-scanner/v2/cmd/osv-scanner@${OSV_SCANNER_VERSION}"
          test -s pubspec.lock
          osv-scanner scan source --config ../../osv-scanner.toml --lockfile pubspec.lock
      - name: Run Flutter tests
        run: flutter test
      - name: Build USB-device debug APK
        run: |
          set +e
          set -o pipefail
          flutter build apk --debug --dart-define=ANUM_API_URL=http://127.0.0.1:8000/ 2>&1 | tee flutter-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -Ei '(error:|failed|failure|exception|what went wrong|requires |could not|problem occurred)' flutter-build.log | tail -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$status"
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: anum-mobile-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
