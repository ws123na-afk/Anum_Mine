name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  web:
    name: Web and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm docs:check
      - run: pnpm check
      - run: pnpm build

  api-unit:
    name: API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install --disable-pip-version-check "pip==24.3.1"
      - run: python -m pip install --disable-pip-version-check -e "services/api[test]"
      - run: python -m pytest services/api -m "not database"

  browser-e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @anum/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  api-persistence:
    name: API PostgreSQL persistence tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: anum
          POSTGRES_PASSWORD: anum
          POSTGRES_DB: anum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anum -d anum_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ANUM_TEST_DATABASE_URL: postgresql+psycopg://anum:anum@localhost:5432/anum_test
      ANUM_DATABASE_URL: postgresql+psycopg://anum:anum@localhost:5432/anum_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - run: python -m pip install --disable-pip-version-check "pip==24.3.1"
      - run: python -m pip install --disable-pip-version-check -e "services/api[test]"
      - name: Apply database migrations
        working-directory: services/api
        run: python -m alembic upgrade head
      - name: Run database tests
        run: python -m pytest services/api -m database

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker/compose.yaml config

  desktop:
    name: Tauri desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm build
      - run: pnpm check:desktop

  android:
    name: Android client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - run: gradle -p apps/android testDebugUnitTest assembleDebug

  flutter-mobile:
    name: Flutter mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform wrappers
        run: flutter create --platforms=android,ios .
      - name: Configure voice permissions
        run: dart run tool/configure_native.dart
      - run: flutter pub get
      - name: Run Flutter analyzer
        continue-on-error: true
        run: flutter analyze
      - name: Run Flutter tests
        continue-on-error: true
        run: flutter test
      - name: Build USB-device debug APK
        run: flutter build apk --debug --dart-define=ANUM_API_URL=http://127.0.0.1:8000/
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: anum-mobile-debug
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
