name: Deploy staging

# Builds the API and web images on every push to main and pushes them to GHCR.
# The deploy job only runs once the owner has chosen a cloud provider and set the
# `STAGING_DEPLOY_TARGET` repository variable (docs/infrastructure.md). Until then it is
# skipped, so this workflow never fails for lack of credentials. It never runs on PRs.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.names.outputs.api_image }}
      web_image: ${{ steps.names.outputs.web_image }}
    steps:
      - uses: actions/checkout@v7
      - name: Image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "api_image=ghcr.io/${owner}/anum-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "web_image=ghcr.io/${owner}/anum-web:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build API image
        env:
          IMAGE: ${{ steps.names.outputs.api_image }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE" services/api
      - name: Build web image
        env:
          IMAGE: ${{ steps.names.outputs.web_image }}
          # Public staging API origin compiled into the bundle. Unset: local default.
          STAGING_API_URL: ${{ vars.STAGING_API_URL }}
          # Staging Keycloak issuer (for example https://id.example.com/realms/anum).
          STAGING_OIDC_ISSUER: ${{ vars.STAGING_OIDC_ISSUER }}
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --build-arg "VITE_ANUM_API_URL=${STAGING_API_URL:-http://localhost:8000}" \
            --build-arg "VITE_ANUM_OIDC_ISSUER=${STAGING_OIDC_ISSUER:-}" \
            -f apps/web/Dockerfile -t "$IMAGE" .
      - name: Push images
        env:
          API_IMAGE: ${{ steps.names.outputs.api_image }}
          WEB_IMAGE: ${{ steps.names.outputs.web_image }}
        run: |
          docker push "$API_IMAGE"
          docker push "$WEB_IMAGE"
          echo "### Images" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$API_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$WEB_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to staging
    needs: images
    # Skipped until the owner picks a cloud and sets the STAGING_DEPLOY_TARGET variable.
    if: ${{ vars.STAGING_DEPLOY_TARGET != '' }}
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_WEB_URL }}
    permissions:
      contents: read
    env:
      DEPLOY_TARGET: ${{ vars.STAGING_DEPLOY_TARGET }}
      API_IMAGE: ${{ needs.images.outputs.api_image }}
      WEB_IMAGE: ${{ needs.images.outputs.web_image }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
    steps:
      - uses: actions/checkout@v7
      # OWNER DECISION NEEDED: replace this step with the chosen provider's deploy.
      # It must (1) run `python -m alembic upgrade head` with the API image as a one-off
      # job, then (2) roll out API_IMAGE and WEB_IMAGE, reading every secret from the
      # `staging` environment's secret store. Until then it fails loudly instead of
      # pretending to deploy.
      - name: Deploy images (provider-specific, not implemented)
        run: |
          case "$DEPLOY_TARGET" in
            *)
              echo "::error::No deploy implementation for STAGING_DEPLOY_TARGET='${DEPLOY_TARGET}'. Add the provider steps in .github/workflows/deploy-staging.yml (see docs/infrastructure.md)."
              exit 1
              ;;
          esac
      - name: Smoke test staging API
        if: ${{ vars.STAGING_API_URL != '' }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS "${STAGING_API_URL%/}/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging API did not become healthy"
          exit 1
