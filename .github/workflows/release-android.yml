name: Android release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload AAB directly to Google Play Internal Testing
        type: boolean
        default: true

permissions:
  contents: read

env:
  ANUM_BUILD_NUMBER_OFFSET: ${{ vars.ANUM_BUILD_NUMBER_OFFSET }}

jobs:
  android:
    name: Android app bundle
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ steps.version.outputs.version }}
      BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
      PRODUCTION_API_URL: ${{ vars.ANUM_PRODUCTION_API_URL || 'https://api.anum360os.com/' }}
      PRODUCTION_OIDC_ISSUER: ${{ vars.ANUM_PRODUCTION_OIDC_ISSUER || 'https://auth.anum360os.com/realms/anum' }}
      PRODUCTION_WEB_APP_URL: ${{ vars.ANUM_PRODUCTION_WEB_APP_URL || 'https://app.anum360os.com/' }}
    steps:
      - uses: actions/checkout@v7
      - name: Version and build number
        id: version
        run: |
          version="$(sed -n 's/^version: *\\([0-9][0-9]*\\.[0-9][0-9]*\\.[0-9][0-9]*\\).*/\\1/p' apps/mobile/pubspec.yaml)"
          offset="${ANUM_BUILD_NUMBER_OFFSET:-0}"
          build_number=$((GITHUB_RUN_NUMBER + offset))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
      - name: Check signing secrets and production configuration
        id: config
        env:
          ANUM_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANUM_ANDROID_KEYSTORE_BASE64 }}
          ANUM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANUM_ANDROID_KEYSTORE_PASSWORD }}
          ANUM_ANDROID_KEY_ALIAS: ${{ secrets.ANUM_ANDROID_KEY_ALIAS }}
          ANUM_ANDROID_KEY_PASSWORD: ${{ secrets.ANUM_ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANUM_PRODUCTION_API_URL: ${{ vars.ANUM_PRODUCTION_API_URL || 'https://api.anum360os.com/' }}
          ANUM_PRODUCTION_OIDC_ISSUER: ${{ vars.ANUM_PRODUCTION_OIDC_ISSUER || 'https://auth.anum360os.com/realms/anum' }}
          ANUM_PRODUCTION_WEB_APP_URL: ${{ vars.ANUM_PRODUCTION_WEB_APP_URL || 'https://app.anum360os.com/' }}
          UPLOAD: ${{ inputs.upload }}
        run: bash .github/scripts/mobile-release-config.sh android
      - uses: actions/setup-java@v6
        if: steps.config.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.config.outputs.build == 'true'
        with:
          channel: stable
          cache: true
      - name: Decode the upload keystore
        if: steps.config.outputs.build == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANUM_ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/anum-upload.jks"
          test -s "$RUNNER_TEMP/anum-upload.jks"
          echo "ANUM_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/anum-upload.jks" >> "$GITHUB_ENV"
      - name: Write the Firebase push config
        if: steps.config.outputs.build == 'true'
        env:
          ANUM_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANUM_ANDROID_GOOGLE_SERVICES_JSON }}
        run: bash .github/scripts/mobile-firebase-config.sh android
      - name: Build the signed app bundle
        if: steps.config.outputs.build == 'true'
        working-directory: apps/mobile
        env:
          ANUM_ANDROID_REQUIRE_RELEASE_SIGNING: "true"
          ANUM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANUM_ANDROID_KEYSTORE_PASSWORD }}
          ANUM_ANDROID_KEY_ALIAS: ${{ secrets.ANUM_ANDROID_KEY_ALIAS }}
          ANUM_ANDROID_KEY_PASSWORD: ${{ secrets.ANUM_ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          jq -n --arg api "$PRODUCTION_API_URL" --arg issuer "$PRODUCTION_OIDC_ISSUER" --arg web "$PRODUCTION_WEB_APP_URL" \
            '{ANUM_API_URL: $api, ANUM_OIDC_ISSUER: $issuer} + (if $web == "" then {} else {ANUM_WEB_APP_URL: $web} end)' > "$RUNNER_TEMP/production.json"
          # Obfuscated Dart (owner decision 12 Oct); the symbols to read crash stack traces are
          # uploaded below as anum-android-symbols-<build number> (docs/mobile.md#crash-symbols).
          flutter build appbundle --release \
            --build-name="$VERSION" --build-number="$BUILD_NUMBER" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define-from-file="$RUNNER_TEMP/production.json"
          aab=build/app/outputs/bundle/release/app-release.aab
          mv "$aab" "build/app/outputs/bundle/release/anum-$VERSION-$BUILD_NUMBER.aab"
          aab="build/app/outputs/bundle/release/anum-$VERSION-$BUILD_NUMBER.aab"
          # Fails unless the bundle is signed with the upload key, not the debug key.
          keytool -printcert -jarfile "$aab" | tee "$RUNNER_TEMP/aab-cert.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/aab-cert.txt"; then
            echo "::error::The bundle is signed with the debug key."
            exit 1
          fi
          (cd "$(dirname "$aab")" && sha256sum "$(basename "$aab")" | tee "$(basename "$aab").sha256")
          echo "- Android: \`$(cat "$aab.sha256")\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the decoded keystore
        if: always() && steps.config.outputs.build == 'true'
        run: rm -f "$RUNNER_TEMP/anum-upload.jks"
      - name: Upload app bundle
        if: steps.config.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: anum-android-release
          path: |
            apps/mobile/build/app/outputs/bundle/release/*.aab
            apps/mobile/build/app/outputs/bundle/release/*.sha256
          if-no-files-found: error
      - name: Upload Dart symbols
        if: steps.config.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: anum-android-symbols-${{ env.BUILD_NUMBER }}
          path: apps/mobile/build/symbols/
          retention-days: 90
          if-no-files-found: error
      - name: Upload to the Play internal track
        if: steps.config.outputs.build == 'true' && steps.config.outputs.play == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.anum.app
          releaseFiles: apps/mobile/build/app/outputs/bundle/release/*.aab
          track: internal
          # "draft" until the app's first release has been reviewed in Play Console.
          status: ${{ vars.ANUM_PLAY_RELEASE_STATUS || 'completed' }}
      - name: Play upload skipped
        if: steps.config.outputs.build == 'true' && steps.config.outputs.play != 'true'
        run: echo "::notice title=Play upload skipped::Build-only run. A release tag or the upload input uploads (and then needs the PLAY_SERVICE_ACCOUNT_JSON secret)."

  android-apk:
    # An installable APK for phones that are not on a Play track (sideloading, the owner's own
    # phone). Built on every run with the production configuration, so it can never fall back to
    # the development sign-in. Signed with the upload key when all four signing secrets are set,
    # else with the debug key (installable, never uploaded to Play); docs/mobile.md#installable-apk.
    name: Android installable APK
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ steps.version.outputs.version }}
      BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
      PRODUCTION_API_URL: ${{ vars.ANUM_PRODUCTION_API_URL || 'https://api.anum360os.com/' }}
      PRODUCTION_OIDC_ISSUER: ${{ vars.ANUM_PRODUCTION_OIDC_ISSUER || 'https://auth.anum360os.com/realms/anum' }}
      PRODUCTION_WEB_APP_URL: ${{ vars.ANUM_PRODUCTION_WEB_APP_URL || 'https://app.anum360os.com/' }}
    steps:
      - uses: actions/checkout@v7
      - name: Version and build number
        id: version
        run: |
          version="$(sed -n 's/^version: *\\([0-9][0-9]*\\.[0-9][0-9]*\\.[0-9][0-9]*\\).*/\\1/p' apps/mobile/pubspec.yaml)"
          offset="${ANUM_BUILD_NUMBER_OFFSET:-0}"
          build_number=$((GITHUB_RUN_NUMBER + offset))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"
      - name: Check the production configuration
        run: |
          for value in "$PRODUCTION_API_URL" "$PRODUCTION_OIDC_ISSUER" "$PRODUCTION_WEB_APP_URL"; do
            if [[ "$value" != https://* ]]; then
              echo "::error title=APK misconfigured::The ANUM_PRODUCTION_* variables must start with https:// (got $value)."
              exit 1
            fi
          done
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Decode the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANUM_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice title=APK signed with the debug key::The Android signing secrets are not set. The APK installs on a phone but cannot update a Play-installed app and must never be uploaded to Play."
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/anum-upload.jks"
          test -s "$RUNNER_TEMP/anum-upload.jks"
          echo "ANUM_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/anum-upload.jks" >> "$GITHUB_ENV"
      - name: Write the Firebase push config
        env:
          ANUM_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANUM_ANDROID_GOOGLE_SERVICES_JSON }}
        run: bash .github/scripts/mobile-firebase-config.sh android
      - name: Build the release APK
        working-directory: apps/mobile
        env:
          ANUM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANUM_ANDROID_KEYSTORE_PASSWORD }}
          ANUM_ANDROID_KEY_ALIAS: ${{ secrets.ANUM_ANDROID_KEY_ALIAS }}
          ANUM_ANDROID_KEY_PASSWORD: ${{ secrets.ANUM_ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          jq -n --arg api "$PRODUCTION_API_URL" --arg issuer "$PRODUCTION_OIDC_ISSUER" --arg web "$PRODUCTION_WEB_APP_URL" \
            '{ANUM_API_URL: $api, ANUM_OIDC_ISSUER: $issuer, ANUM_WEB_APP_URL: $web}' > "$RUNNER_TEMP/production.json"
          flutter build apk --release \
            --build-name="$VERSION" --build-number="$BUILD_NUMBER" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define-from-file="$RUNNER_TEMP/production.json"
          dir=build/app/outputs/flutter-apk
          mv "$dir/app-release.apk" "$dir/anum-$VERSION-$BUILD_NUMBER.apk"
          (cd "$dir" && sha256sum "anum-$VERSION-$BUILD_NUMBER.apk" | tee "anum-$VERSION-$BUILD_NUMBER.apk.sha256")
          {
            echo "- Installable APK: \`$(cat "$dir/anum-$VERSION-$BUILD_NUMBER.apk.sha256")\`"
            echo "  - API \`$PRODUCTION_API_URL\`, sign-in \`$PRODUCTION_OIDC_ISSUER\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/anum-upload.jks"
      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: anum-android-apk
          path: |
            apps/mobile/build/app/outputs/flutter-apk/anum-*.apk
            apps/mobile/build/app/outputs/flutter-apk/anum-*.apk.sha256
          if-no-files-found: error

