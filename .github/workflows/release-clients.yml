name: Release clients

# Builds the store and desktop release artifacts (docs/mobile.md and docs/desktop.md, "Release
# pipeline"). A `v*` tag builds the mobile apps for that version and uploads them to the Play
# internal track and TestFlight. A manual run builds the committed version and uploads to the
# stores only when asked. The desktop installers (and the draft GitHub release that carries them)
# are deferred by the owner: they build only when the ANUM_RELEASE_DESKTOP variable is `true`
# (tags) or the `desktop` input is ticked (manual runs); otherwise those jobs are skipped.
#
# Signing material comes only from repository secrets and is decoded into $RUNNER_TEMP. Every
# signing or upload step is gated on its secrets (.github/scripts/mobile-release-config.sh): a
# build-only manual run without them builds what it can (or skips) with a notice, while a run that
# must upload (a release tag or the upload input) fails naming every missing secret and variable,
# and so does a partly set signing set. Nothing secret is written to the repository, the build
# outputs or the logs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to the Play internal track and TestFlight (needs the store secrets)
        type: boolean
        default: false
      desktop:
        description: Also build the desktop installers (deferred; needs the desktop secrets to sign)
        type: boolean
        default: false

concurrency:
  group: release-clients-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      upload: ${{ steps.version.outputs.upload }}
      desktop: ${{ steps.version.outputs.desktop }}
    steps:
      - uses: actions/checkout@v7
      - name: Version, build number and upload decision
        id: version
        env:
          UPLOAD_INPUT: ${{ inputs.upload }}
          DESKTOP_INPUT: ${{ inputs.desktop }}
          # Desktop releases are deferred; `true` builds them on tags as well.
          DESKTOP_ON_TAGS: ${{ vars.ANUM_RELEASE_DESKTOP }}
          # Added to the run number so store build numbers can continue above a manual upload.
          BUILD_NUMBER_OFFSET: ${{ vars.ANUM_BUILD_NUMBER_OFFSET }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Plain X.Y.Z: MSI installers and the stores reject other version shapes.
            if ! [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Release tags must look like v1.2.3 (got $GITHUB_REF_NAME)."
              exit 1
            fi
            version="${BASH_REMATCH[1]}"
            upload=true
            desktop="$([ "$DESKTOP_ON_TAGS" = "true" ] && echo true || echo false)"
          else
            # The X.Y.Z part of `version: X.Y.Z+N` in pubspec.yaml (the build number comes from the run).
            version="$(sed -n 's/^version: *\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' apps/mobile/pubspec.yaml)"
            if [ -z "$version" ]; then
              echo "::error::apps/mobile/pubspec.yaml has no X.Y.Z version."
              exit 1
            fi
            upload="${UPLOAD_INPUT:-false}"
            desktop="${DESKTOP_INPUT:-false}"
          fi
          offset="${BUILD_NUMBER_OFFSET:-0}"
          if ! [[ "$offset" =~ ^[0-9]+$ ]]; then
            echo "::error::ANUM_BUILD_NUMBER_OFFSET must be a whole number (got $offset)."
            exit 1
          fi
          build_number=$((GITHUB_RUN_NUMBER + offset))
          {
            echo "version=$version"
            echo "build_number=$build_number"
            echo "upload=$upload"
            echo "desktop=$desktop"
          } >> "$GITHUB_OUTPUT"
          echo "### Release $version (build $build_number, store upload: $upload, desktop: $desktop)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$desktop" != "true" ]; then
            echo "::notice title=Desktop release skipped::Desktop releases are deferred. Set the ANUM_RELEASE_DESKTOP variable to true (tags) or tick the desktop input (manual runs) to build them."
          fi

  android:
    name: Android app bundle
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      PRODUCTION_API_URL: ${{ vars.ANUM_PRODUCTION_API_URL || 'https://api.anum360os.com/' }}
      PRODUCTION_OIDC_ISSUER: ${{ vars.ANUM_PRODUCTION_OIDC_ISSUER || 'https://auth.anum360os.com/realms/anum' }}
      PRODUCTION_WEB_APP_URL: ${{ vars.ANUM_PRODUCTION_WEB_APP_URL || 'https://app.anum360os.com/' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check signing secrets and production configuration
        id: config
        env:
          ANUM_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANUM_ANDROID_KEYSTORE_BASE64 }}
          ANUM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANUM_ANDROID_KEYSTORE_PASSWORD }}
          ANUM_ANDROID_KEY_ALIAS: ${{ secrets.ANUM_ANDROID_KEY_ALIAS }}
          ANUM_ANDROID_KEY_PASSWORD: ${{ secrets.ANUM_ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ANUM_PRODUCTION_API_URL: ${{ vars.ANUM_PRODUCTION_API_URL || 'https://api.anum360os.com/' }}
          ANUM_PRODUCTION_OIDC_ISSUER: ${{ vars.ANUM_PRODUCTION_OIDC_ISSUER || 'https://auth.anum360os.com/realms/anum' }}
          ANUM_PRODUCTION_WEB_APP_URL: ${{ vars.ANUM_PRODUCTION_WEB_APP_URL || 'https://app.anum360os.com/' }}
          UPLOAD: ${{ needs.version.outputs.upload }}
        run: bash .github/scripts/mobile-release-config.sh android
      - uses: actions/setup-java@v6
        if: steps.config.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.config.outputs.build == 'true'
        with:
          channel: stable
          cache: true
      - name: Decode the upload keystore
        if: steps.config.outputs.build == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANUM_ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/anum-upload.jks"
          test -s "$RUNNER_TEMP/anum-upload.jks"
          echo "ANUM_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/anum-upload.jks" >> "$GITHUB_ENV"
      - name: Build the signed app bundle
        if: steps.config.outputs.build == 'true'
        working-directory: apps/mobile
        env:
          ANUM_ANDROID_REQUIRE_RELEASE_SIGNING: "true"
          ANUM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANUM_ANDROID_KEYSTORE_PASSWORD }}
          ANUM_ANDROID_KEY_ALIAS: ${{ secrets.ANUM_ANDROID_KEY_ALIAS }}
          ANUM_ANDROID_KEY_PASSWORD: ${{ secrets.ANUM_ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          jq -n --arg api "$PRODUCTION_API_URL" --arg issuer "$PRODUCTION_OIDC_ISSUER" --arg web "$PRODUCTION_WEB_APP_URL" \
            '{ANUM_API_URL: $api, ANUM_OIDC_ISSUER: $issuer} + (if $web == "" then {} else {ANUM_WEB_APP_URL: $web} end)' > "$RUNNER_TEMP/production.json"
          # Obfuscated Dart (owner decision 12 Oct); the symbols to read crash stack traces are
          # uploaded below as anum-android-symbols-<build number> (docs/mobile.md#crash-symbols).
          flutter build appbundle --release \
            --build-name="$VERSION" --build-number="$BUILD_NUMBER" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define-from-file="$RUNNER_TEMP/production.json"
          aab=build/app/outputs/bundle/release/app-release.aab
          mv "$aab" "build/app/outputs/bundle/release/anum-$VERSION-$BUILD_NUMBER.aab"
          aab="build/app/outputs/bundle/release/anum-$VERSION-$BUILD_NUMBER.aab"
          # Fails unless the bundle is signed with the upload key, not the debug key.
          keytool -printcert -jarfile "$aab" | tee "$RUNNER_TEMP/aab-cert.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/aab-cert.txt"; then
            echo "::error::The bundle is signed with the debug key."
            exit 1
          fi
          (cd "$(dirname "$aab")" && sha256sum "$(basename "$aab")" | tee "$(basename "$aab").sha256")
          echo "- Android: \`$(cat "$aab.sha256")\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the decoded keystore
        if: always() && steps.config.outputs.build == 'true'
        run: rm -f "$RUNNER_TEMP/anum-upload.jks"
      - name: Upload app bundle
        if: steps.config.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: anum-android-release
          path: |
            apps/mobile/build/app/outputs/bundle/release/*.aab
            apps/mobile/build/app/outputs/bundle/release/*.sha256
          if-no-files-found: error
      - name: Upload Dart symbols
        if: steps.config.outputs.build == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: anum-android-symbols-${{ env.BUILD_NUMBER }}
          path: apps/mobile/build/symbols/
          retention-days: 90
          if-no-files-found: error
      - name: Upload to the Play internal track
        if: steps.config.outputs.build == 'true' && steps.config.outputs.play == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.anum.app
          releaseFiles: apps/mobile/build/app/outputs/bundle/release/*.aab
          track: internal
          # "draft" until the app's first release has been reviewed in Play Console.
          status: ${{ vars.ANUM_PLAY_RELEASE_STATUS || 'completed' }}
      - name: Play upload skipped
        if: steps.config.outputs.build == 'true' && steps.config.outputs.play != 'true'
        run: echo "::notice title=Play upload skipped::Build-only run. A release tag or the upload input uploads (and then needs the PLAY_SERVICE_ACCOUNT_JSON secret)."

  android-apk:
    # An installable APK for phones that are not on a Play track (sideloading, the owner's own
    # phone). Built on every run with the production configuration, so it can never fall back to
    # the development sign-in. Signed with the upload key when all four signing secrets are set,
    # else with the debug key (installable, never uploaded to Play); docs/mobile.md#installable-apk.
    name: Android installable APK
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      PRODUCTION_API_URL: ${{ vars.ANUM_PRODUCTION_API_URL || 'https://api.anum360os.com/' }}
      PRODUCTION_OIDC_ISSUER: ${{ vars.ANUM_PRODUCTION_OIDC_ISSUER || 'https://auth.anum360os.com/realms/anum' }}
      PRODUCTION_WEB_APP_URL: ${{ vars.ANUM_PRODUCTION_WEB_APP_URL || 'https://app.anum360os.com/' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the production configuration
        run: |
          for value in "$PRODUCTION_API_URL" "$PRODUCTION_OIDC_ISSUER" "$PRODUCTION_WEB_APP_URL"; do
            if [[ "$value" != https://* ]]; then
              echo "::error title=APK misconfigured::The ANUM_PRODUCTION_* variables must start with https:// (got $value)."
              exit 1
            fi
          done
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Decode the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANUM_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice title=APK signed with the debug key::The Android signing secrets are not set. The APK installs on a phone but cannot update a Play-installed app and must never be uploaded to Play."
            exit 0
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/anum-upload.jks"
          test -s "$RUNNER_TEMP/anum-upload.jks"
          echo "ANUM_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/anum-upload.jks" >> "$GITHUB_ENV"
      - name: Build the release APK
        working-directory: apps/mobile
        env:
          ANUM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANUM_ANDROID_KEYSTORE_PASSWORD }}
          ANUM_ANDROID_KEY_ALIAS: ${{ secrets.ANUM_ANDROID_KEY_ALIAS }}
          ANUM_ANDROID_KEY_PASSWORD: ${{ secrets.ANUM_ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          jq -n --arg api "$PRODUCTION_API_URL" --arg issuer "$PRODUCTION_OIDC_ISSUER" --arg web "$PRODUCTION_WEB_APP_URL" \
            '{ANUM_API_URL: $api, ANUM_OIDC_ISSUER: $issuer, ANUM_WEB_APP_URL: $web}' > "$RUNNER_TEMP/production.json"
          flutter build apk --release \
            --build-name="$VERSION" --build-number="$BUILD_NUMBER" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define-from-file="$RUNNER_TEMP/production.json"
          dir=build/app/outputs/flutter-apk
          mv "$dir/app-release.apk" "$dir/anum-$VERSION-$BUILD_NUMBER.apk"
          (cd "$dir" && sha256sum "anum-$VERSION-$BUILD_NUMBER.apk" | tee "anum-$VERSION-$BUILD_NUMBER.apk.sha256")
          {
            echo "- Installable APK: \`$(cat "$dir/anum-$VERSION-$BUILD_NUMBER.apk.sha256")\`"
            echo "  - API \`$PRODUCTION_API_URL\`, sign-in \`$PRODUCTION_OIDC_ISSUER\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/anum-upload.jks"
      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: anum-android-apk
          path: |
            apps/mobile/build/app/outputs/flutter-apk/anum-*.apk
            apps/mobile/build/app/outputs/flutter-apk/anum-*.apk.sha256
          if-no-files-found: error

  ios:
    name: iOS app
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
      PRODUCTION_API_URL: ${{ vars.ANUM_PRODUCTION_API_URL || 'https://api.anum360os.com/' }}
      PRODUCTION_OIDC_ISSUER: ${{ vars.ANUM_PRODUCTION_OIDC_ISSUER || 'https://auth.anum360os.com/realms/anum' }}
      PRODUCTION_WEB_APP_URL: ${{ vars.ANUM_PRODUCTION_WEB_APP_URL || 'https://app.anum360os.com/' }}
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - name: Check signing secrets and production configuration
        id: config
        # The job's default working directory is apps/mobile.
        working-directory: .
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ANUM_PRODUCTION_API_URL: ${{ vars.ANUM_PRODUCTION_API_URL || 'https://api.anum360os.com/' }}
          ANUM_PRODUCTION_OIDC_ISSUER: ${{ vars.ANUM_PRODUCTION_OIDC_ISSUER || 'https://auth.anum360os.com/realms/anum' }}
          ANUM_PRODUCTION_WEB_APP_URL: ${{ vars.ANUM_PRODUCTION_WEB_APP_URL || 'https://app.anum360os.com/' }}
          UPLOAD: ${{ needs.version.outputs.upload }}
        run: bash .github/scripts/mobile-release-config.sh ios
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Compile check (no code signing)
        if: steps.config.outputs.signed != 'true'
        run: >-
          flutter build ios --release --no-codesign
          --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          --obfuscate --split-debug-info=build/symbols
          --dart-define=ANUM_API_URL=https://api.anum.invalid/
          --dart-define=ANUM_OIDC_ISSUER=https://id.anum.invalid/realms/anum
      - name: Write the App Store Connect API key
        if: steps.config.outputs.signed == 'true'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"
      - name: Archive and export the signed IPA
        # flutter build ipa cannot hand xcodebuild an App Store Connect API key, so Flutter writes
        # the configuration and xcodebuild archives with automatic, cloud-managed signing.
        if: steps.config.outputs.signed == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          jq -n --arg api "$PRODUCTION_API_URL" --arg issuer "$PRODUCTION_OIDC_ISSUER" --arg web "$PRODUCTION_WEB_APP_URL" \
            '{ANUM_API_URL: $api, ANUM_OIDC_ISSUER: $issuer} + (if $web == "" then {} else {ANUM_WEB_APP_URL: $web} end)' > "$RUNNER_TEMP/production.json"
          # --config-only writes the obfuscation settings into Generated.xcconfig, so the
          # xcodebuild archive below compiles obfuscated Dart and writes the symbols to build/symbols.
          flutter build ios --release --config-only \
            --build-name="$VERSION" --build-number="$BUILD_NUMBER" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define-from-file="$RUNNER_TEMP/production.json"
          auth=(
            -allowProvisioningUpdates
            -authenticationKeyPath "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"
            -authenticationKeyID "$API_KEY_ID"
            -authenticationKeyIssuerID "$API_ISSUER_ID"
          )
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/ios/archive/Runner.xcarchive \
            "${auth[@]}" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic archive
          /usr/libexec/PlistBuddy -c "Clear dict" \
            -c "Add :method string app-store-connect" \
            -c "Add :teamID string $APPLE_TEAM_ID" \
            -c "Add :signingStyle string automatic" \
            -c "Add :destination string export" \
            -c "Add :uploadSymbols bool true" \
            -c "Add :manageAppVersionAndBuildNumber bool false" \
            "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" "${auth[@]}"
          ipa="$(ls build/ios/ipa/*.ipa)"
          mv "$ipa" "build/ios/ipa/anum-$VERSION-$BUILD_NUMBER.ipa"
          cd build/ios/ipa
          shasum -a 256 "anum-$VERSION-$BUILD_NUMBER.ipa" | tee "anum-$VERSION-$BUILD_NUMBER.ipa.sha256"
          echo "- iOS: \`$(cat "anum-$VERSION-$BUILD_NUMBER.ipa.sha256")\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload IPA
        if: steps.config.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: anum-ios-release
          path: |
            apps/mobile/build/ios/ipa/*.ipa
            apps/mobile/build/ios/ipa/*.sha256
          if-no-files-found: error
      - name: Upload Dart symbols
        if: steps.config.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: anum-ios-symbols-${{ env.BUILD_NUMBER }}
          path: apps/mobile/build/symbols/
          retention-days: 90
          if-no-files-found: error
      - name: Upload to TestFlight
        if: steps.config.outputs.signed == 'true' && steps.config.outputs.upload == 'true'
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
        run: |
          xcrun altool --upload-app --type ios \
            --file "build/ios/ipa/anum-$VERSION-$BUILD_NUMBER.ipa" \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
      - name: TestFlight upload skipped
        if: steps.config.outputs.signed == 'true' && steps.config.outputs.upload != 'true'
        run: echo "::notice title=TestFlight upload skipped::Runs on release tags or with the upload input."
      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"

  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: version
    # Deferred by the owner: skipped (not failed) unless asked for, see the version job.
    if: needs.version.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: darwin-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Unset variables fall back to the production deployment (api.anum360os.com and
      # auth.anum360os.com/realms/anum, apps/desktop/scripts/release-config.mjs); a local or
      # plain-HTTP address stops the build, so an installer never uses the development session.
      VITE_ANUM_API_URL: ${{ vars.ANUM_PRODUCTION_API_URL }}
      VITE_ANUM_OIDC_ISSUER: ${{ vars.ANUM_PRODUCTION_OIDC_ISSUER }}
      VITE_ANUM_OIDC_CLIENT_ID: anum-desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.12.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # Pinned by commit, so the toolchain is named here instead of in the ref.
          toolchain: stable
      - run: pnpm install --frozen-lockfile
      - name: Import the Windows code-signing certificate
        id: windows_cert
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CERTIFICATE_BASE64: ${{ secrets.ANUM_WINDOWS_CERTIFICATE_PFX_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.ANUM_WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:CERTIFICATE_BASE64) {
            "imported=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "anum-signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERTIFICATE_BASE64))
          $password = ConvertTo-SecureString $env:CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password | Out-Null
          Remove-Item $pfx
          "imported=true" >> $env:GITHUB_OUTPUT
      - name: Build release installers
        env:
          # Public values (repository variables).
          ANUM_DESKTOP_VERSION: ${{ needs.version.outputs.version }}
          ANUM_TAURI_UPDATER_PUBKEY: ${{ vars.ANUM_TAURI_UPDATER_PUBKEY }}
          ANUM_TAURI_UPDATER_ENDPOINT: ${{ vars.ANUM_TAURI_UPDATER_ENDPOINT }}
          ANUM_WINDOWS_CERTIFICATE_THUMBPRINT: ${{ vars.ANUM_WINDOWS_CERTIFICATE_THUMBPRINT }}
          ANUM_WINDOWS_TIMESTAMP_URL: ${{ vars.ANUM_WINDOWS_TIMESTAMP_URL }}
          WINDOWS_CERT_IMPORTED: ${{ steps.windows_cert.outputs.imported }}
          # Secrets, read by the Tauri CLI. Empty ones are unset below.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          for name in TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID ANUM_TAURI_UPDATER_PUBKEY \
            ANUM_TAURI_UPDATER_ENDPOINT ANUM_WINDOWS_CERTIFICATE_THUMBPRINT ANUM_WINDOWS_TIMESTAMP_URL \
            VITE_ANUM_API_URL VITE_ANUM_OIDC_ISSUER; do
            [ -n "${!name}" ] || unset "$name"
          done
          if [ -n "${ANUM_TAURI_UPDATER_PUBKEY:-}" ] && [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::notice title=Updater artifacts skipped::ANUM_TAURI_UPDATER_PUBKEY is set but the TAURI_SIGNING_PRIVATE_KEY secret is not."
            unset ANUM_TAURI_UPDATER_PUBKEY
          elif [ -z "${ANUM_TAURI_UPDATER_PUBKEY:-}" ]; then
            echo "::notice title=Updater artifacts skipped::Set the ANUM_TAURI_UPDATER_PUBKEY and ANUM_TAURI_UPDATER_ENDPOINT variables and the TAURI_SIGNING_PRIVATE_KEY secret."
          fi
          if [ -n "${ANUM_WINDOWS_CERTIFICATE_THUMBPRINT:-}" ] && [ "$WINDOWS_CERT_IMPORTED" != "true" ]; then
            echo "::notice title=Authenticode signing skipped::ANUM_WINDOWS_CERTIFICATE_THUMBPRINT is set but the ANUM_WINDOWS_CERTIFICATE_PFX_BASE64 secret is not."
            unset ANUM_WINDOWS_CERTIFICATE_THUMBPRINT
          fi
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER_ID" ] && [ -n "$API_KEY_P8" ]; then
              # Notarization with the App Store Connect API key (read by the Tauri CLI).
              mkdir -p "$RUNNER_TEMP/private_keys"
              (umask 077 && printf '%s\n' "$API_KEY_P8" > "$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8")
              export APPLE_API_KEY="$API_KEY_ID" APPLE_API_ISSUER="$API_ISSUER_ID"
              export APPLE_API_KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${API_KEY_ID}.p8"
            else
              echo "::notice title=macOS signing skipped::Needs the APPLE_CERTIFICATE secrets and the App Store Connect API key for notarization."
              unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            fi
          fi
          unset API_KEY_P8
          pnpm build
          pnpm --filter @anum/desktop build:release
          rm -rf "$RUNNER_TEMP/private_keys"
      - name: Collect installers and the updater manifest fragment
        env:
          PLATFORM: ${{ matrix.platform }}
          ARTIFACT_BASE_URL: ${{ vars.ANUM_TAURI_UPDATER_ARTIFACT_BASE_URL }}
        run: |
          base="${ARTIFACT_BASE_URL:-https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}}"
          node apps/desktop/scripts/updater-manifest.mjs collect \
            --bundle-dir apps/desktop/src-tauri/target/release/bundle \
            --platform "$PLATFORM" --version "$VERSION" --base-url "$base" --out "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          for file in *; do
            case "$file" in *.sig|*.json) ;; *) sha256sum "$file" > "$file.sha256" ;; esac
          done
          cat ./*.sha256 >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: anum-desktop-${{ matrix.platform }}
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  publish:
    name: Draft GitHub release
    needs: [version, desktop]
    # Carries only the desktop installers, so it is skipped with them.
    if: github.ref_type == 'tag' && needs.version.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: anum-desktop-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Write the updater manifest
        run: |
          cd "$RUNNER_TEMP/release"
          shopt -s nullglob
          fragments=(latest-*.json)
          if [ "${#fragments[@]}" -eq 0 ]; then
            echo "::notice title=No updater manifest::No platform produced signed updater artifacts."
            exit 0
          fi
          node "$GITHUB_WORKSPACE/apps/desktop/scripts/updater-manifest.mjs" merge \
            --version "$VERSION" --notes "ANUM $VERSION" --out latest.json "${fragments[@]}"
          rm "${fragments[@]}"
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd "$RUNNER_TEMP/release"
          # Drafts are invisible to the updater until the owner publishes them (docs/desktop.md).
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" ./* --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "ANUM $VERSION" --generate-notes
          fi
