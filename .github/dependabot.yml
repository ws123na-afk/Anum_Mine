# Dependency update PRs (docs/security.md, "Scanning in CI"). Minor and patch updates
# are grouped per ecosystem to keep the PR count low; majors arrive one per PR.
# Security updates are raised regardless of the schedule when they are enabled in the
# repository settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: pub
    directory: /apps/mobile
    schedule:
      interval: weekly
    ignore:
      # Held at 6.3.29, the last Java release: later versions need AGP 9
      # built-in Kotlin, which apps/mobile turns off (docs/mobile.md, Dependencies).
      - dependency-name: url_launcher_android
    groups:
      pub:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /services/api
      - /apps/web
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /infra/docker
    schedule:
      interval: weekly
