# gitleaks configuration for CI secret scanning (docs/security.md).
# Uses the default ruleset. Each allowlist below is a reviewed false positive, scoped
# to the exact file and text so a real secret in the same file is still reported.

title = "ANUM gitleaks configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Figma file key: a public design-file identifier, not a credential"
condition = "AND"
paths = ['''^docs/figma-design-state\.json$''']
regexTarget = "match"
regexes = ['''^fileKey":\s*"[A-Za-z0-9]{22}"$''']

[[allowlists]]
description = "Prose 'Keycloak, S3-compatible' trips generic-api-key on the word 'key'"
condition = "AND"
paths = ['''^docs/infrastructure\.md$''']
regexTarget = "match"
regexes = ['''^Keycloak, S3-compatible\s*$''']

[[allowlists]]
description = "Fake provider key used as a test fixture for at-rest encryption, never a real credential"
condition = "AND"
paths = ['''^services/api/tests/test_postgres_model_configs\.py$''']
regexTarget = "secret"
regexes = ['''^sk-live-PERSISTED-secret-4321$''']

[[allowlists]]
description = "Render Blueprint and its test name environment variables (key: ANUM_...), never their values"
condition = "AND"
paths = ['''^render\.yaml$''', '''^services/api/tests/test_render_blueprint\.py$''']
regexTarget = "secret"
regexes = ['''^ANUM_[A-Z0-9_]+$''']

[[allowlists]]
description = "One-VM compose test names environment variables (\"ANUM_S3_SECRET_KEY\"), never their values"
condition = "AND"
paths = ['''^services/api/tests/test_oracle_compose\.py$''']
regexTarget = "secret"
regexes = ['''^ANUM_[A-Z0-9_]+$''']

[[allowlists]]
description = "Keycloak authenticator-config alias (the name of a 2FA flow step), not a credential"
condition = "AND"
paths = ['''^infra/keycloak/two_factor\.py$''']
regexTarget = "secret"
regexes = ['''^anum-2fa-unless-passkey$''']

[[allowlists]]
description = "Apple sign-in setup checks that a pasted .p8 has its PEM header and footer; the text is the check and its error message, never key material"
condition = "AND"
paths = ['''^infra/keycloak/social_login\.py$''']
regexTarget = "match"
regexes = ['''^-----BEGIN PRIVATE KEY-----"\) and key\.endswith\("-----END PRIVATE KEY-----"\)\):\s+raise KcadmError\(\s+"the Apple private key must be the whole AuthKey_<KEYID>\.p8 file, from "\s+"-----BEGIN PRIVATE KEY-----$''']

[[allowlists]]
description = "Base64 of the plain text 'fake-key-for-tests-only-32-bytes', once used as a Settings secrets_key in an Email Center test (commit 1979d4b; the test now generates a key at run time), never a credential"
condition = "AND"
paths = ['''^services/api/tests/test_mail_center\.py$''']
regexTarget = "secret"
regexes = ['''^ZmFrZS1rZXktZm9yLXRlc3RzLW9ubHktMzItYnl0ZXM=?$''']

[[allowlists]]
description = "Fake idempotency key in the S-05 turn rate test, committed once before it was renamed; not a credential"
condition = "AND"
paths = ['''^services/api/tests/test_live_agent_meeting_turn_rate\.py$''']
regexTarget = "match"
regexes = ['''key-12345678''']
